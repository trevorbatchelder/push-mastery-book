/* ---------------------------------------------------------------- the scenes: one loop per module, the foe track, SFX on their own bus */
/* ================================================================ THE SCENES — the course's world, in Live's own idiom.
   The guitar book's arenas, battles and chiptune songs are here as a Session View: each module has a scene — a short
   original loop (D.loops, computed and asserted in export_push.py) of Drums, Bass, Keys and Lead, plus a fifth track of
   wrong notes, the foe. It plays under every take of that module. A right answer is a hit on the foe track (its meter
   drains); a wrong answer is the foe clipping your headroom. Keep the take and the foe drops out — the loop plays clean.
   SFX are synthesized with the book's own voices on their own bus (Music.fx), ducking the loop. Nothing is typed here:
   every note comes from D.loops. */
const LOOP_BY = Object.fromEntries((D.loops || []).map(l => [l.id, l]));
const Music = (() => {
  let bus = null, fxBus = null, cur = null, timer = 0, base = 0, step = 0, foeOn = true, onStep = null;
  const on = () => store.get('music', true);
  function ensure() { audio(); if (bus) return;
    bus = A.ctx.createGain(); bus.gain.value = on() ? .42 : 0; bus.connect(A.out);
    fxBus = A.ctx.createGain(); fxBus.gain.value = .9; fxBus.connect(A.out); }
  // which scene the open lesson wants: the module's loop under a take or a test-out, silence on the map and elsewhere
  function want() {
    if ((PAGES[at] || {}).id !== 'learn' || bookMode()) return null;
    const s = state('course', {open: -1, challenge: -1});
    if (s.challenge >= 0 && MODULES[s.challenge]) return MODULES[s.challenge].scene;
    if (s.open >= 0 && LESSONS[s.open]) { const l = LESSONS[s.open]; return l.exam ? MODULES[MODULES.length - 1].scene : MODULES[l.mod].scene; }
    return null;
  }
  const pcOf = (L, deg) => SCALE_BY[L.scale].steps[deg % 7] + 12 * Math.floor(deg / 7);
  function play(L, s, t) {   // one sixteenth step of the loop: every track that has something on it
    const P = PT_BY[L.pattern], sec = 60 / L.bpm / 4, i = s % 16;
    OUT_OVERRIDE = bus;
    try {
      Object.entries(P.hits).forEach(([k, xs]) => { if (xs.includes(i)) playDrum(k, t, i % 4 === 0 ? .75 : .55); });
      L.bass.forEach(([at, pc, len]) => { if (at === s) synthNote(36 + L.root + pc, t, {dur: len * sec * .9, gain: .11, cutoff: 520, release: .08}); });
      L.keys.forEach(([at, pcs, len]) => { if (at === s) pcs.forEach(pc => synthNote(48 + L.root + pc, t, {dur: len * sec * .95, gain: .035, cutoff: 1100, attack: .05, release: .3})); });
      L.lead.forEach(([at, idx, len]) => { if (at === s) synthNote(60 + L.root + pcOf(L, idx), t, {dur: len * sec * .85, gain: .075, cutoff: 2400, release: .12}); });
      if (foeOn) L.foe.notes.forEach(([at, pc, len]) => { if (at === s) { const m = 72 + L.root + pc;   // two saws a quarter-tone apart: the wrong note, beating
        synthNote(m, t, {dur: len * sec * .8, gain: .05, cutoff: 5200, release: .05}); synthNote(m + .5, t, {dur: len * sec * .8, gain: .045, cutoff: 5200, release: .05}); hit(t, {freq: 4200, gain: .08, decay: .02}); } });
    } finally { OUT_OVERRIDE = null; }
  }
  function tick() {
    if (!cur) return;
    const ctx = A.ctx, sec = 60 / cur.bpm / 4, sw = (PT_BY[cur.pattern].swing || 0) / 100 * sec / 3;
    while (true) {
      const t = base + step * sec + (step % 2 ? sw : 0);
      if (t > ctx.currentTime + .22) break;
      play(cur, step % cur.steps, t);
      if (onStep) { const s = step % cur.steps; setTimeout(() => onStep && onStep(s), Math.max(0, (t - ctx.currentTime) * 1000)); }
      step++;
    }
    timer = setTimeout(tick, 40);
  }
  function start(id) { const L = LOOP_BY[id]; if (!L) return; ensure(); cur = L; step = 0; base = A.ctx.currentTime + .12; clearTimeout(timer); tick(); }
  function stop() { clearTimeout(timer); cur = null; }
  function sync() { const w = want(); if (!on() || !w) { stop(); return; } if (!cur || cur.id !== w) { foeOn = true; start(w); }
    if (A.ctx && A.ctx.state !== 'running') { const kick = () => { audio(); document.removeEventListener('pointerdown', kick); }; document.addEventListener('pointerdown', kick); } }
  function toggle() { store.set('music', !on()); if (bus) bus.gain.setTargetAtTime(on() ? .42 : 0, A.ctx.currentTime, .05); sync(); redraw(); }
  const duck = () => { if (!bus || !on()) return; const t = A.ctx.currentTime; bus.gain.cancelScheduledValues(t); bus.gain.setValueAtTime(.16, t); bus.gain.setTargetAtTime(.42, t + .35, .12); };
  // the SFX, on their own bus: attack (a right answer), foe (a wrong one), coin (a gem), bump (an item), win, lose
  function fx(kind) {
    ensure(); const t = A.ctx.currentTime + .02; OUT_OVERRIDE = fxBus; duck();
    try {
      if (kind === 'attack') [72, 76, 79, 83].forEach((m, i) => synthNote(m, t + i * .045, {dur: .18, gain: .15, cutoff: 3800}));
      else if (kind === 'foe') { synthNote(43, t, {dur: .32, gain: .2, cutoff: 900}); synthNote(44, t, {dur: .32, gain: .14, cutoff: 900}); hit(t, {freq: 2600, gain: .25, decay: .06}); }
      else if (kind === 'coin') [88, 95, 100].forEach((m, i) => synthNote(m, t + i * .06, {dur: .14, gain: .1, cutoff: 6000, attack: .002}));
      else if (kind === 'bump') { hit(t, {freq: 1800, type: 'bandpass', q: 2, gain: .25, decay: .02}); boom(t, {f0: 220, f1: 160, len: .08, gain: .25, type: 'triangle'}); }
      else if (kind === 'win') { const L = cur || LOOP_BY[MODULES[0].scene]; L.win.forEach((pc, i) => synthNote(60 + L.root + pc, t + i * .09, {dur: .9 - i * .1, gain: .13, cutoff: 3000})); hit(t + .36, {freq: 5200, gain: .18, decay: .45, len: 1.2}); }
      else if (kind === 'lose') { [55, 54, 53, 48].forEach((m, i) => synthNote(m, t + i * .11, {dur: .3, gain: .14, cutoff: 1100})); boom(t + .44, {f0: 120, f1: 35, len: .6, gain: .8}); }
    } finally { OUT_OVERRIDE = null; }
  }
  return {sync, stop, toggle, on, fx, want, setFoe: v => { foeOn = v; }, current: () => cur, watch: f => { onStep = f; }};
})();
const PT_BY = Object.fromEntries(D.patterns.map(p => [p.id, p]));
// the music chip: on the quiz toolbar and the map's top row
const musicChip = () => h('button', {class: 'music-chip', 'aria-pressed': Music.on() ? 'true' : 'false', title: Music.on() ? 'Scene playing — tap to mute' : 'Scene muted — tap to play',
  on: {click: e => { e.stopPropagation(); Music.toggle(); }}}, h('i'), Music.on() ? 'Scene' : 'Muted');

/* the scene strip: a Session View of the module's loop above the take. Five tracks; the fifth is the foe, with a meter
   that drains as you answer. ar.hit(ok) is called per answer, ar.beaten(won) at the end. */
const TRACK_COLS = ['var(--teal)', 'var(--navy)', 'var(--plum)', 'var(--gold)'];
function arena(mod, host, foeMax) {
  const M = MODULES[mod] || MODULES[0], L = LOOP_BY[M.scene], S = SCALE_BY[L.scale];
  let hp = foeMax, out = false;
  const tracks = ['Drums', 'Bass', 'Keys', 'Lead'].map((nm, i) => h('div', {class: 'sc-track', style: `--c:${TRACK_COLS[i]}`}, h('span', {class: 'sc-name'}, nm), h('span', {class: 'sc-clip'}, h('i'), i === 0 ? PT_BY[L.pattern].name : nm === 'Keys' ? `${KEYS[L.root]} ${S.name}` : ''), h('span', {class: 'sc-lvl'}, h('i'))));
  const foeMeter = h('span', {class: 'sc-foe-meter'}, h('i'));
  const foeClip = h('span', {class: 'sc-clip'}, h('i'), L.foe.name);
  const foe = h('div', {class: 'sc-track foe', style: '--c:var(--rec)'}, h('span', {class: 'sc-name'}, 'Foe'), foeClip, foeMeter);
  const head = h('div', {class: 'sc-head'}, h('span', {class: 'label'}, `Scene · ${L.name}`), h('span', {class: 'muted'}, `${L.bpm} BPM · ${KEYS[L.root]} ${S.name}`), h('span', {class: 'sp'}), musicChip());
  const strip = h('div', {class: 'scene-strip', style: `--m:${M.acc}`}, head, ...tracks, foe);
  host.append(strip);
  const hud = () => { foeMeter.firstChild.style.width = (hp / foeMax * 100) + '%'; };
  Music.watch(s => { if (!strip.isConnected) { Music.watch(null); return; } const beat = s % 4 === 0;
    tracks.forEach((t, i) => t.classList.toggle('pulse', beat && (i !== 1 || s % 8 === 0)));
    if (!out) foe.classList.toggle('pulse', s % 4 === 2); });
  hud();
  return {
    hit(ok) { if (ok) { hp = Math.max(0, hp - 1); foe.classList.remove('struck'); void foe.offsetWidth; foe.classList.add('struck'); }
      else { strip.classList.remove('clipped'); void strip.offsetWidth; strip.classList.add('clipped'); } hud(); },
    beaten(won) { out = true; foe.classList.toggle('out', won); foe.classList.toggle('pulse', false); Music.setFoe(!won);
      foeClip.lastChild.textContent = won ? `${L.foe.name} · dropped out` : `${L.foe.name} · still in the mix`; if (won) hp = 0; hud(); },
    hp: () => hp,
  };
}

/* ---------------------------------------------------------------- 5 Listen: the pad grid as a listening surface (Web MIDI, or tap the pads) */
/* ================================================================ 5 LISTEN: the pad grid as a listening surface.
   The guitar book's Song Sketchpad listens through the microphone; a Push has no pitch to hear, so this page listens
   to MIDI. With Push 3 (or any MIDI keyboard) connected and Web MIDI available, incoming notes light the 64 Notes grid;
   the chord is named by ChordFinder (the Song Compass engine, from pitches — no audio), the key by KeyFinder, and the
   next chord is suggested by Suggest from the book's own progression library (D.progs). Where Web MIDI is absent —
   iPadOS Safari — the page is a tap-the-pads sketchpad: the same engine listens to the pads you press. */
const Listen = (() => {
  const held = new Map();                 // midi -> {t0, src, voice}
  let kf = KeyFinder.create(), trail = [], cur = null, lastSeen = null, midi = {ok: null, inputs: [], msg: ''}, ui = null;
  const stOf = () => state('listen', {key: 0, scale: 'major', inkey: true, layout: '4ths', oct: 0, sound: false});
  const gridKey = () => { const st = stOf(), S = SCALE_BY[st.scale] || SCALE_BY.major, minor = S.steps.includes(3) && !S.steps.includes(4);
    return Suggest.keyOf(rootOf(KEYS[st.key]), minor ? 'minor' : 'major'); };
  // the key the suggestions use: the one heard, once it is at least a lean; the grid's own key until then
  const keyNow = () => { const r = kf.result(); return r.state === 'listening' ? gridKey() : Suggest.keyOf(r.best.tonic, r.best.mode); };
  // name the chord in the held notes: a 12-bin chroma from pitches, the lowest note as the bass, pure-note templates

function whereFound(id) {

  if (g[0] === 'lesson') { const L = LESSONS.find(l => l.topic === g[1]); return L ? `clear “${L.name}”` : 'keep learning'; }
  if (g[0] === 'page') { const P = PAGES.find(p => p.id === g[1]); return P ? `visit ${P.name}` : 'keep exploring'; }

    mid.push(h('div', {class: 'gb-prog'}, h('div', {class: 'gb-prog-t'}, h('b', {}, `${done} / ${LESSONS.length}`), h('small', {}, `clips · ${pct}%`)), h('div', {class: 'gb-meter'}, h('i', {style: `width:${pct}%`}))));
    right.push(h('button', {class: 'gb-btn', title: 'Back up or restore your progress', on: {click: backupPanel}}, '⇩', h('small', {}, 'Backup')));
  } else {
    left.push(h('button', {class: 'gb-btn gb-back', on: {click: G.back}}, '← Session'));
    mid.push(h('div', {class: 'gb-prog'}, h('div', {class: 'gb-prog-t'}, h('b', {}, G.name)), G.hearts ? headroom(G.hearts(), G.max) : ''));
    (G.items ? G.items() : []).forEach(it => right.push(h('button', {class: 'gb-btn gb-item', disabled: !it.ok, title: it.title || '',
      on: {click: () => { if (it.ok) it.use(); }}}, it.icon, h('small', {}, `${it.label} · ${it.cost ? it.cost + '◆' : 'free'}`))));
  }
  bar.append(h('button', {class: 'arrow', 'aria-label': 'previous page', html: IC.chevL, on: {click: () => page(at - 1, true)}}),
    ...left, ...mid, h('div', {class: 'sp'}), pts, gems, ...right,
    h('button', {class: 'arrow', 'aria-label': 'next page', html: IC.chevR, on: {click: () => page(at + 1)}}));
}

/* ================================================================ THE QUESTION BANK
   One list of question factories per lesson topic (see modules.js). Each factory returns {q, a, opts, hint, why}
   and may add `svg` (a picture under the question) or `play` (a sound). `why` is shown after answering so a wrong
   pick still teaches. Pad notes, scales, chord shapes and beats are computed from D.*, never typed. */
const Q = (q, a, wrong, hint, why) => () => ({q, a, opts: shuffle([a, ...wrong]), hint, why});
const strOpts = (a, pool) => shuffle([a, ...sample([...new Set(pool)].filter(x => x !== a), 3)]);
const ORD = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'];
const rndKeyI = () => rnd(12);
const SC7 = D.scales.filter(s => s.steps.length === 7);
const pcName = (root, pc) => SH[(root + pc) % 12];
// a small 8 x 8 grid with some pads marked: '?' is the asked pad, 'a/b/c' are shape pads
function gridSVG({root = 0, steps = SCALE_BY.major.steps, inkey = true, layout = '4ths', marks = {}, names = false} = {}) {
  const s = 26, o = [`<svg viewBox="0 0 ${8 * s + 6} ${8 * s + 6}" width="230" xmlns="${NS}" role="img" aria-label="pad grid">`];
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const m = padMidi(c, r, {root, steps, layout, inkey}), pc = ((m - root) % 12 + 12) % 12, mk = marks[c + ',' + r];
    const fill = mk ? (mk === '?' ? 'var(--gold)' : 'var(--teal)') : pc === 0 ? 'var(--rust)' : steps.includes(pc) ? 'var(--padlit)' : 'var(--pad)';
    const x = 3 + c * s, y = 3 + (7 - r) * s;
    o.push(`<rect x="${x + 1.5}" y="${y + 1.5}" width="${s - 3}" height="${s - 3}" rx="4" fill="${fill}" opacity="${mk || pc === 0 || steps.includes(pc) ? 1 : .55}"/>`);
    if (mk === '?') o.push(`<text x="${x + s / 2}" y="${y + s / 2 + 5}" text-anchor="middle" font-size="14" font-weight="900" fill="#151515">?</text>`);
    else if (names) o.push(`<text x="${x + s / 2}" y="${y + s / 2 + 3.5}" text-anchor="middle" font-size="8" font-weight="800" fill="#151515">${noteName(m)}</text>`);
  }
  return o.join('') + '</svg>';
}
// a one-bar drum pattern as rows of 16 cells
function beatSVG(p, rows = ['kick', 'snare', 'clap', 'chh', 'ohh', 'rim']) {
  const use = rows.filter(r => p.hits[r] && p.hits[r].length), s = 17, L = 70, o = [`<svg viewBox="0 0 ${L + 16 * s + 4} ${use.length * s + 6}" width="360" xmlns="${NS}" role="img" aria-label="beat">`];
  use.forEach((r, j) => { o.push(`<text x="0" y="${j * s + 15}" font-size="11" font-weight="800" fill="var(--mute)">${KIT_BY[r].name}</text>`);
    for (let i = 0; i < 16; i++) o.push(`<rect x="${L + i * s + 1}" y="${j * s + 3}" width="${s - 3}" height="${s - 3}" rx="3" fill="${p.hits[r].includes(i) ? 'var(--teal)' : 'var(--pad)'}" opacity="${p.hits[r].includes(i) ? 1 : i % 4 ? .45 : .8}"/>`); });
  return o.join('') + '</svg>';
}

  for (let i = 0; i < 32; i++) Object.entries(p.hits).forEach(([k, xs]) => { if (xs.includes(i % 16)) playDrum(k, t0 + i * s16 + (i % 2 ? (p.swing || 0) / 300 * s16 : 0), i % 4 ? .8 : 1); }); };

      return {q: `In Key, ${SH[k]} ${s.name}. Is ${out} on the pads?`, a: 'No', opts: ['Yes', 'No'], hint: 'Only the notes of the scale appear.', why: `${SH[k]} ${s.name} is ${s.steps.map(x => pcName(k, x)).join(' ')} — ${out} is not in it, so In Key hides it.`}; },

    Q('For a brighter minor feel (house, funk), which scale on Push?', 'Dorian', ['Locrian', 'Phrygian', 'Whole Tone'], 'Minor with a raised 6th.', 'Dorian is natural minor with a major sixth — minor, but it lifts.'),

    Q('Output Type on a track can be:', 'the Main track, another track, a return… or an external output', ['only the Main', 'only headphones', 'only Push'], 'Where it goes.', 'Routing a track into a Group or another track is how you build buses and vocoders.'),
    Q('Why would an armed MIDI track with Monitoring set to Off make no sound when you play?', 'Monitoring Off means the live input is never heard, only playback', ['the pads are broken', 'In Key is off', 'the track is frozen'], 'Auto, not Off.', 'Set Monitoring to Auto: the input is heard while armed.'),
  ],
};

/* ---------------------------------------------------------------- the Index */
PAGES.push({id: 'index', no: '6', name: 'The Index', blurb: 'every term and idea in the book, organized', acc: 'var(--plum)', draw(v) {
  pageScroll = true;
  v.append(header('6', 'The Index'));
  const st = state('indexpage', {sec: 'az'});
  const go = sec => { st.sec = sec; keep('indexpage', st); redraw(); };
  const navBtn = ([sec, label]) => h('button', {class: 'btn' + (st.sec === sec ? ' acc' : ''), style: 'justify-content:flex-start;text-align:left;min-height:42px', on: {click: () => go(sec)}}, label);
  const nav = h('div', {style: 'display:flex;flex-direction:column;gap:6px'},
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin-bottom:2px'}, 'THE TERMS'),
    navBtn(['az', 'Everything A–Z']), ...IDX_GROUPS.map(g => navBtn([g[0], g[1]])),
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin:10px 0 2px'}, 'THE IDEAS'),
    ...INDEX_SUBS.filter(s => s[0] !== 'glossary').map(([k, nm]) => navBtn(['facts:' + k, nm])));
  const body = h('div', {style: 'display:flex;flex-direction:column;gap:12px;min-width:0'});
  const row = c => discovered(c.id) ? h('button', {class: 'gloss-row', 'data-c': c.id}, h('b', {}, c.term), h('span', {}, c.short))
    : h('button', {class: 'gloss-row unfound', 'data-c': c.id, title: 'Not found yet — it still opens'}, h('b', {}, '? ' + c.term), h('span', {}, `Not found yet · ${whereFound(c.id)}`));
  const nFound = (D.concepts || []).filter(c => discovered(c.id)).length, nAll = (D.concepts || []).length;
  if (!bookMode()) body.append(h('div', {class: 'found-bar'}, h('b', {}, `${nFound} of ${nAll} found`), h('span', {}, 'clear lessons, visit pages and workflows, and tap terms in the book to collect the rest'),
    h('div', {class: 'found-meter'}, h('i', {style: `width:${Math.round(nFound / nAll * 100)}%`}))));
  if (st.sec.startsWith('facts:')) {
    const k = st.sec.slice(6), name = (INDEX_SUBS.find(s => s[0] === k) || [])[1], facts = (D.theory.facts || []).filter(f => f.tag === k);
    body.append(sec2(name, 'the ideas behind the lessons · tap any term to open it', 'var(--navy)',
      h('div', {class: 'facts'}, facts.map(f => h('div', {class: 'fact'}, h('h3', {}, f.t), h('p', {html: glossify(f.b)}))))));
  } else if (st.sec === 'az') {
    const cs = (D.concepts || []).slice().sort((a, b) => a.term.localeCompare(b.term));
    const list = h('div', {class: 'gloss'}); let letter = '';
    cs.forEach(c => { const l = c.term[0].toUpperCase();
      if (l !== letter) { letter = l; list.append(h('div', {style: 'grid-column:1/-1;font-weight:900;color:var(--navy);margin:8px 0 0;letter-spacing:.1em'}, l)); }
      list.append(row(c)); });
    body.append(sec2('Everything A–Z', 'every term in the book · tap one to open it, then follow “see also”', 'var(--navy)', list));
  } else {
    const g = IDX_GROUPS.find(x => x[0] === st.sec) || IDX_GROUPS[0], byId = {}; (D.concepts || []).forEach(c => byId[c.id] = c);
    body.append(sec2(g[1], 'tap a term to open it · related terms link onward', 'var(--navy)',
      h('div', {class: 'gloss'}, g[2].filter(id => byId[id]).map(id => row(byId[id])))));
  }
  v.append(h('div', {class: 'body', style: 'grid-template-columns:minmax(185px,.3fr) minmax(0,1fr);align-items:start'}, nav, body));
}});


/* ---------------------------------------------------------------- motion: springs, touch-down feedback, morphing thumbs, fluid page turns */
/* ================================================================ MOTION: one spring, touch-down feedback, morphing thumbs, fluid page turns
   After Apple's WWDC18 "Designing Fluid Interfaces" and WWDC25 "Meet Liquid Glass":
   respond on touch-down and commit on touch-up; describe motion by damping and response, never duration;
   stay interruptible (a new touch takes over from wherever the motion is); things grow from where you touched
   and leave the way they came; materialize by sharpening out of a blur rather than fading. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
// a damped spring from 0 to 1: damping ratio ζ (1 = no overshoot), response T (seconds for one undamped cycle)
function springAt(t, zeta, T) {
  const w0 = 2 * Math.PI / T;
  if (zeta >= 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  const wd = w0 * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + zeta * w0 / wd * Math.sin(wd * t));
}
// the same spring as a CSS linear() easing and the time it takes to settle, so CSS and JS move alike
function springCSS(zeta, T) {
  let end = T; for (let t = T * 4; t > 0; t -= 0.004) if (Math.abs(1 - springAt(t, zeta, T)) > 0.001) { end = t + 0.004; break; }
  const pts = Array.from({length: 48}, (_, i) => +springAt(end * i / 47, zeta, T).toFixed(4)); pts[47] = 1;
  return {ease: `linear(${pts.join(', ')})`, ms: Math.round(end * 1000)};
}
// four springs for the whole book: press (quick, firm), snap (no overshoot), morph (a little squish), page (gentle)
const SPRINGS = {press: springCSS(1, .22), snap: springCSS(1, .38), morph: springCSS(.78, .42), page: springCSS(.9, .55)};
(() => { const r = document.documentElement.style; for (const [k, s] of Object.entries(SPRINGS)) { r.setProperty(`--sp-${k}`, s.ease); r.setProperty(`--sp-${k}-ms`, s.ms + 'ms'); } })();

/* ---------------- touch-down: press in at once, glow from the exact touch point, commit on release (the browser's click) */
const PRESSABLE = 'button,.cbox,.chip,select,.neckwrap';
let lastTap = {x: 0, y: 0, t: 0, el: null};
document.addEventListener('pointerdown', e => {
  lastTap = {x: e.clientX, y: e.clientY, t: performance.now(), el: e.target};
  const el = e.target.closest(PRESSABLE); if (!el || el.disabled) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--gx', `${e.clientX - r.left}px`); el.style.setProperty('--gy', `${e.clientY - r.top}px`);
  el.classList.remove('glow'); void el.offsetWidth; el.classList.add('pressing', 'glow');
  const up = () => { el.classList.remove('pressing'); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.removeEventListener('pointerleave', up); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
}, {passive: true});
document.addEventListener('animationend', e => { if (e.animationName === 'glow') e.target.classList.remove('glow'); });

/* ---------------- morphing thumbs: a segmented control's selection (and the key ring's) slides to its new place.
   The page redraws on every choice, so each group's last thumb rect is remembered by name and the new thumb
   springs from there (FLIP). */
const THUMBS = new Map();
function placeThumbs(v) {
  const pid = (PAGES[at] || {}).id;
  v.querySelectorAll('.seg, .keyring').forEach((g, n) => {
    const on = g.querySelector('[aria-pressed="true"]'); if (!on) return;
    const key = `${pid}:${g.getAttribute('aria-label') || g.className}:${n}`;
    const th = h('span', {class: 'thumb', 'aria-hidden': 'true'}); g.prepend(th); g.classList.add('has-thumb');
    const put = () => { th.style.left = on.offsetLeft + 'px'; th.style.top = on.offsetTop + 'px'; th.style.width = on.offsetWidth + 'px'; th.style.height = on.offsetHeight + 'px'; };
    put();
    const was = THUMBS.get(key), now = {x: on.offsetLeft, y: on.offsetTop, w: on.offsetWidth, h: on.offsetHeight};
    THUMBS.set(key, now);
    if (!was || REDUCED.matches || (was.x === now.x && was.y === now.y && was.w === now.w)) return;
    const dx = was.x - now.x, dy = was.y - now.y, sx = was.w / now.w;
    th.animate([{transform: `translate(${dx}px, ${dy}px) scaleX(${sx})`}, {transform: 'none'}], {duration: SPRINGS.morph.ms, easing: SPRINGS.morph.ease});
    th.animate([{filter: 'brightness(1.35)'}, {filter: 'none'}], {duration: SPRINGS.morph.ms * .8, easing: 'ease-out'});   // the glass "energizes" as it moves
  });
}

/* ---------------- page turns: grow out of what you tapped; slide in from the side you swiped toward */
function materialize(v, back) {
  document.dispatchEvent(new Event('turn'));   // a new page starts with the practice bar out
  if (REDUCED.matches) return;
  const recent = performance.now() - lastTap.t < 600 && lastTap.el && lastTap.el.closest && lastTap.el.closest('.home-tiles button, .home-go, .term, .cpop button');
  v.classList.remove('grow');
  if (recent) { const r = v.getBoundingClientRect(); v.style.transformOrigin = `${lastTap.x - r.left}px ${lastTap.y - r.top + ($('#page').scrollTop || 0)}px`; v.classList.add('grow'); }
  else v.style.transformOrigin = '';
}

/* ---------------- the swipe: the page follows the finger, and release velocity decides — a flick turns it, a slow
   drag past a quarter of the width turns it, anything less springs home. A new touch catches it mid-flight. */
(() => {
  const frame = $('#page'); if (!frame) return;
  let x0 = 0, y0 = 0, dx = 0, lock = null, samples = [], start = 0;
  const pg = () => $('#pg');
  const set = (x, tr) => { const p = pg(); p.style.transition = tr || 'none'; p.style.transform = x ? `translateX(${x}px)` : ''; p.style.opacity = tr || !x ? '' : String(1 - Math.min(.35, Math.abs(x) / innerWidth * .6)); };
  frame.addEventListener('touchstart', e => {
    if (e.touches.length > 1 || e.target.closest('.neckwrap,.tabwrap,.scroll,input,select,textarea,.lib')) { lock = 'no'; return; }
    const t = e.touches[0], m = new DOMMatrix(getComputedStyle(pg()).transform);   // catch a page that is still springing back
    start = m.m41; x0 = t.clientX - start; y0 = t.clientY; dx = start; lock = null; samples = [[t.clientX, performance.now()]];
    if (start) set(start);
  }, {passive: true});
  frame.addEventListener('touchmove', e => {
    if (lock === 'no') return; const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!lock) { if (Math.hypot(mx - start, my) < 10) return; lock = Math.abs(mx - start) > Math.abs(my) * 1.3 ? 'x' : 'no'; if (lock === 'no') { if (start) set(0, `transform var(--sp-snap-ms) var(--sp-snap)`); return; } }
    dx = mx; samples.push([t.clientX, performance.now()]); if (samples.length > 6) samples.shift();
    set(dx);
  }, {passive: true});
  const end = () => {
    if (lock !== 'x') { lock = null; return; } lock = null;
    const [a, b] = [samples[0], samples[samples.length - 1]], vel = b && a && b[1] > a[1] ? (b[0] - a[0]) / (b[1] - a[1]) : 0;   // px per ms
    const projected = dx + vel * 180, w = innerWidth;
    if (Math.abs(projected) > w * .25 && Math.abs(dx) > 24) {
      const dir = projected < 0 ? 1 : -1;
      set(-dir * w * .5, `transform ${SPRINGS.press.ms}ms ease-in, opacity ${SPRINGS.press.ms}ms ease-in`); pg().style.opacity = '0';
      setTimeout(() => { const p = pg(); p.style.transition = 'none'; p.style.transform = ''; p.style.opacity = ''; page(at + dir, dir < 0); }, SPRINGS.press.ms * .8);
    } else set(0, `transform var(--sp-morph-ms) var(--sp-morph), opacity var(--sp-snap-ms) var(--sp-snap)`);
  };
  frame.addEventListener('touchend', end, {passive: true}); frame.addEventListener('touchcancel', end, {passive: true});
})();

/* ---------------- the glass bars: a shadow that deepens when content scrolls under the top bar, and a highlight that follows the finger */
(() => {
  const frame = $('#page'); if (!frame) return;
  // the practice bar minimizes on a scroll down and returns on any scroll up, near the top, or at the end of the page
  let lastY = 0, travel = 0;
  const R = document.documentElement, mini = on => R.classList.toggle('mini', on);
  frame.addEventListener('scroll', () => {
    const y = frame.scrollTop, dy = y - lastY; lastY = y; R.classList.toggle('under', y > 6);
    travel = Math.sign(dy) === Math.sign(travel) ? travel + dy : dy;   // distance moved in one direction, so a jitter does not flip it
    if (y < 60 || y + frame.clientHeight > frame.scrollHeight - 4) mini(false);
    else if (travel > 24) mini(true); else if (travel < -12) mini(false);
  }, {passive: true});
  document.addEventListener('turn', () => { lastY = 0; travel = 0; mini(false); });
  const bar = $('#pbar');
  bar && bar.addEventListener('pointerdown', e => { if (R.classList.contains('mini') && !e.target.closest('button')) mini(false); });
  bar && bar.addEventListener('pointermove', e => { const r = bar.getBoundingClientRect(); bar.style.setProperty('--sx', `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%`); }, {passive: true});
})();

// the book's reading order: the course up front, then the instrument, then the Index
const PAGE_ORDER = ['cover', 'learn', 'pads', 'workflows', 'controls', 'listen', 'index'];
PAGES.sort((a, b) => PAGE_ORDER.indexOf(a.id) - PAGE_ORDER.indexOf(b.id));
PAGES.forEach(p => p.blurb = p.blurb || '');
const start = (location.hash || '').slice(1), si = PAGES.findIndex(p => p.id === start);
page(si >= 0 ? si : store.get('at', 0));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
