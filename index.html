heel","group":"nav","fn":"Turn to move through lists, press to choose, nudge left to go back, nudge right to rename.","combos":[]},{"id":"dpad","name":"Session D-pad","group":"nav","fn":"Arrows move around the Session; the centre button selects.","combos":[]},{"id":"strip","name":"Touch Strip","group":"perform","fn":"Pitch bend or mod wheel while playing; the note range while step sequencing; the Drum Rack bank on drum tracks.","combos":[]},{"id":"encoders","name":"Encoders","group":"perform","fn":"Eight touch-sensitive knobs that follow the mode: device parameters, mix levels, clip settings, menu choices.","combos":[]},{"id":"upper","name":"Upper Display Buttons","group":"perform","fn":"Eight buttons above the display; what they do is printed on the screen in each mode.","combos":[]},{"id":"lower","name":"Lower Display Buttons","group":"perform","fn":"Eight buttons below the display: usually one per track, to select it (or arm, mute, solo, stop with the held button).","combos":[]},{"id":"display","name":"Display","group":"perform","fn":"Shows whatever Push is focused on: devices, the mixer, the clip, the browser, the Session.","combos":[]},{"id":"pads","name":"Pad Grid","group":"perform","fn":"Sixty-four pads, 8 × 8, fully MPE-capable: velocity, pressure, slide and per-note pitch bend.","combos":[]},{"id":"scenes","name":"Scenes & Repeat Intervals","group":"perform","fn":"Beside the grid. In Session they launch scenes; in Note Mode they set the step size and the Repeat rate (1/4 to 1/32, with triplets).","combos":[]}],"groups":{"global":"Global","edit":"Edit","tempo":"Tempo & level","track":"Track","record":"Record","mode":"Modes","notes":"Notes","nav":"Navigate","browse":"Browse","view":"Views","perform":"Play & see"},"workflows":[{"id":"beat","name":"Program a beat","tag":"Drums","blurb":"From an empty track to a looping drum pattern, without touching the computer.","steps":[{"t":"Press Add and choose a drum kit (a Drum Rack). Push makes a new MIDI track with the kit on it.","c":["add","jog"]},{"t":"Press Note, then Layout until the display says Loop Selector: 16 drum pads bottom-left, steps on top.","c":["note","layout"]},{"t":"Tap the kick pad to select it, then tap steps 1, 5, 9 and 13 in the top half — four on the floor.","c":["pads"]},{"t":"Select the snare or clap pad and tap steps 5 and 13. Pick the hats and fill the off-beats.","c":["pads"]},{"t":"Use the Scenes & Repeat Intervals buttons to change the step size: 1/16 for hats, 1/32 for rolls.","c":["scenes"]},{"t":"Press Play. Turn the Swing and Tempo encoder for tempo; press it and turn for swing.","c":["play","tempo"]},{"t":"Hold Mute and tap a drum pad to drop it out; hold Solo to hear one alone.","c":["mute","solo","pads"]}]},{"id":"bass","name":"Record a bassline in key","tag":"Notes","blurb":"Choose a key once, and the grid stops offering wrong notes.","steps":[{"t":"Press Add and load a bass instrument on a new MIDI track.","c":["add"]},{"t":"Press Scale. Pick the root with the upper display buttons and the scale with the encoders; leave In Key on.","c":["scale","upper","encoders"]},{"t":"Press Note. The root pads take the track colour; every lit pad is in key. Octave Down until the bass sits low.","c":["note","octdown"]},{"t":"Hold Fixed Length and choose 4 bars, so the take is a loop the right size.","c":["fixedlength"]},{"t":"Press Record. Push counts in, records four bars, then keeps playing the loop.","c":["record"]},{"t":"Not tight? Press Quantize to snap the notes to the grid. Hold it first to set how hard.","c":["quantize"]},{"t":"Want another try? Press New for a fresh slot and record again; the first take stays in its clip.","c":["new","record"]}]},{"id":"capture","name":"Catch an idea with Capture","tag":"Record","blurb":"Play first, decide later. Push was listening.","steps":[{"t":"Arm a MIDI track: hold Record and press its lower display button (Push arms the selected track for you).","c":["record","lower"]},{"t":"With nothing recording, just play the pads until something good happens.","c":["pads"]},{"t":"Press Capture. Push turns what you just played into a clip — and if the transport was stopped, it guesses the tempo and the loop.","c":["capture"]},{"t":"Press Clip to look at the loop it found, and the encoders to move or resize it.","c":["clip","encoders"]}]},{"id":"fingerdrum","name":"Finger-drum with Repeat and Accent","tag":"Drums","blurb":"Hi-hat rolls and even fills, played live.","steps":[{"t":"On a drum track, Layout to 64 Pads (or the Loop Selector’s 16 pads).","c":["layout"]},{"t":"Press Repeat. Choose a rate with the Scenes & Repeat Intervals buttons — 1/16 for a hat line.","c":["repeat","scenes"]},{"t":"Hold the hat pad: Push fires it at that rate. Press harder for louder; MPE pressure shapes it as you hold.","c":["pads"]},{"t":"Tap Accent for every hit at full velocity (127) — handy for a kick that must not vary.","c":["accent"]},{"t":"Press Record while you play to keep it. Quantize afterwards if the hand drifted.","c":["record","quantize"]}]},{"id":"slice","name":"Slice a sample onto the pads","tag":"Sampling","blurb":"Turn a drum break or a vocal into something you can play.","steps":[{"t":"Load the sample into Simpler (Add → Samples, or drag it in Live). In Device View set Simpler’s mode to Slicing.","c":["add","device","upper"]},{"t":"Each slice now has a pad. Play them in Note mode to hear the chops.","c":["note","pads"]},{"t":"Press Convert: Push builds a Drum Rack with each slice on its own pad, each with its own Simpler.","c":["convert"]},{"t":"Now every slice can have its own effects, its own pitch and its own steps in the drum sequencer.","c":["device","layout"]}]},{"id":"session","name":"Build a song in Session","tag":"Arrange","blurb":"Ideas as clips, sections as scenes, the song as a sequence of launches.","steps":[{"t":"Press the Session button under the D-pad: columns are tracks, pads are clips, flashing green means queued.","c":["sessionpad"]},{"t":"Tap a pad to launch its clip; tap a scene button beside the grid to launch the whole row.","c":["pads","scenes"]},{"t":"Hold Duplicate and press a scene to copy it, then change one clip in the copy — that is your next section.","c":["duplicate","scenes"]},{"t":"Use New in Note mode to start an empty slot for a variation while the old clip keeps playing.","c":["new","note"]},{"t":"Stop a track’s clip with Stop Clip + its lower display button; Shift + Stop Clip stops them all.","c":["stopclip","shift","lower"]},{"t":"In Live, record your scene launches into the Arrangement (Shift + Record switches where Push records).","c":["shift","record"]}]},{"id":"mix","name":"Mix on Push","tag":"Mix","blurb":"Levels, panning and sends without the mouse.","steps":[{"t":"Press Mix for Global Mix Mode: the encoders are eight tracks’ volumes; the upper display buttons switch to pan and sends.","c":["mix","encoders","upper"]},{"t":"Press Mix again for Track Mix Mode: every setting of the selected track on one page.","c":["mix"]},{"t":"Hold Mute or Solo and press lower display buttons to mute or solo tracks; hold Lock to keep that job on the buttons.","c":["mute","solo","lock","lower"]},{"t":"Press Main Track to set the Main track; turn the Volume Encoder for the output level.","c":["main","volume"]}]},{"id":"automate","name":"Record automation","tag":"Sound","blurb":"Make a filter sweep or a build that moves on its own.","steps":[{"t":"Press Device and find the parameter, say a filter’s frequency, on the encoders.","c":["device","encoders"]},{"t":"Turn Automate on (it lights red) and press Play, or record a clip.","c":["automate","play"]},{"t":"Turn the encoder as the clip plays: the movement is written. Automated parameters show a white dot.","c":["encoders"]},{"t":"Made a mess? Hold Delete and touch the encoder to clear that parameter’s automation.","c":["delete","encoders"]}]},{"id":"sound","name":"Design a sound in Device View","tag":"Sound","blurb":"Shape an instrument from Push, then swap it if it is the wrong one.","steps":[{"t":"Select a track and press Device. The display shows its chain of devices; the encoders hold the selected one’s controls.","c":["device","display","encoders"]},{"t":"Use the upper display buttons to pick a device in the chain, or a bank of its parameters.","c":["upper"]},{"t":"Wrong instrument? Press Swap and turn the jog wheel to hot-swap a different preset in place.","c":["swap","jog"]},{"t":"Press Add to put an audio effect after it — a reverb, Roar, Auto Filter.","c":["add"]},{"t":"Shift while turning gives fine steps for the last bit of tuning.","c":["shift","encoders"]}]},{"id":"melodic","name":"Step a melody with the Melodic Sequencer","tag":"Notes","blurb":"Write notes into steps, like a drum machine for pitch.","steps":[{"t":"On an instrument track press Layout until Melodic Sequencer: rows are pitches, columns are steps.","c":["layout"]},{"t":"Tap pads to place notes; tap again to remove. Page Left / Right moves through the clip.","c":["pads","pageleft","pageright"]},{"t":"Change the step size with the Scenes & Repeat Intervals buttons; Octave moves the pitch range.","c":["scenes","octup","octdown"]},{"t":"Try Melodic Sequencer + 32 Notes: step on top, play on the bottom half to audition notes first.","c":["layout"]}]},{"id":"audio2midi","name":"Turn audio into MIDI","tag":"Sampling","blurb":"Hum a tune, play a chord, beatbox — then keep it as notes.","steps":[{"t":"Record or load an audio clip and select it.","c":["record","clip"]},{"t":"Press Convert. Choose Melody to MIDI, Harmony to MIDI or Drums to MIDI.","c":["convert","upper"]},{"t":"Live makes a new MIDI track with the notes on a matching instrument; change the instrument with Swap.","c":["swap"]}]},{"id":"save","name":"Save, version and go standalone","tag":"Set","blurb":"Never lose a good idea, wherever Push is.","steps":[{"t":"Press Save often. Shift + Save keeps a new version beside the old one; Duplicate + Save starts a new project from this one.","c":["save","shift","duplicate"]},{"t":"Press Sets to open the Set Library, or start a new Set.","c":["sets","jog"]},{"t":"Press Setup to switch between Standalone Mode (Push alone) and Control Mode (Push with Live on a computer).","c":["setup"]},{"t":"Sets made on Push open in Live on the computer, so a sketch on the sofa becomes a mix at the desk.","c":["sets"]}]}],"concepts":[{"id":"push","term":"Push 3","short":"Ableton’s instrument for Live: 64 MPE pads, eight encoders, a display and a jog wheel.","more":"It plays Live from the hardware, and in Standalone Mode it runs Live’s engine itself — no computer needed.","see":["standalone-mode","control-mode","pad-grid"]},{"id":"standalone-mode","term":"Standalone Mode","short":"Push running on its own, with its own processor, sound and storage.","more":"Push starts in Standalone Mode the first time it is powered on. Sets made there open in Live on the computer later.","see":["control-mode","set"]},{"id":"control-mode","term":"Control Mode","short":"Push working as the controller for Live on a computer.","more":"Switch modes in Setup → Status. In Control Mode some buttons reach Live itself: Undo undoes in Live, Shift + Record picks Arrangement or Session recording.","see":["standalone-mode"]},{"id":"pad-grid","term":"Pad Grid","short":"Push’s 8 × 8 pads: notes, drums, steps or clips, depending on the mode.","more":"The pads are fully MPE-capable — each pad senses velocity, pressure, sideways slide and per-note pitch bend.","see":["mpe","note-mode","session-pad-mode"]},{"id":"encoder","term":"Encoder","short":"An endless, touch-sensitive knob. Push has eight above the display, plus Volume and Swing/Tempo.","more":"Encoders follow the mode: device parameters, mix levels, clip settings. Hold Shift for finer steps; hold Delete and touch one to clear its automation.","see":["device-view","automation"]},{"id":"display-buttons","term":"Display Buttons","short":"The two rows of eight buttons above and below the display.","more":"Their job is printed on the screen. The lower row usually selects tracks; hold Mute, Solo, Stop Clip or Record and press one to do that to its track.","see":["lock"]},{"id":"jog-wheel","term":"Jog Wheel","short":"The clickable wheel for moving through lists: turn, press to choose, nudge left to go back.","more":"","see":["browser"]},{"id":"touch-strip","term":"Touch Strip","short":"The vertical strip by the pads: pitch bend or mod wheel while playing.","more":"While step sequencing it scrolls the note range; on a drum track it picks the Drum Rack bank.","see":["pitch-bend"]},{"id":"shift","term":"Shift","short":"Hold for a button’s second job, or for finer encoder steps.","more":"Shift + Undo redoes; Shift + Stop Clip stops every clip; Shift + Save saves a new version.","see":["encoder"]},{"id":"note-mode","term":"Note Mode","short":"The pads play the selected track: notes for an instrument, pads for a Drum Rack.","more":"Press Note to enter it and Layout to change how the pads are laid out.","see":["layout","in-key","drum-rack"]},{"id":"session-pad-mode","term":"Session Pad Mode","short":"The pads become Live’s Session: each column a track, each pad a clip.","more":"A pad in a clip’s colour holds a clip; flashing green is queued to launch; unlit is an empty slot.","see":["session-view","clip-launch","session-overview"]},{"id":"session-overview","term":"Session Overview","short":"A zoomed-out Session: each pad stands for a block of 8 scenes × 8 tracks.","more":"Up to 64 scenes by 64 tracks fit on the grid at once, so you can jump across a big Set.","see":["session-pad-mode"]},{"id":"layout","term":"Layout","short":"The button that cycles pad layouts in Note Mode.","more":"Instruments: 64 Notes, Melodic Sequencer, Melodic Sequencer + 32 Notes. Drum Racks: Loop Selector, 16 Velocities, 64 Pads.","see":["note-mode","loop-selector","melodic-sequencer"]},{"id":"in-key","term":"In Key","short":"A Note Mode setting where only the notes of the chosen key appear on the pads.","more":"Across a row is the next scale note; with the 4ths layout each row is a fourth higher. You cannot play a wrong note — only a surprising one.","see":["chromatic","scale","fourths-layout"]},{"id":"chromatic","term":"Chromatic","short":"A Note Mode setting where all twelve notes are on the pads; out-of-key pads are unlit.","more":"Across a row is a half step; up a row is a fourth. Chord shapes stay the same in every key.","see":["in-key"]},{"id":"fourths-layout","term":"4ths Layout","short":"The default pad layout: each row a fourth above the one below, like a bass or the low strings of a guitar.","more":"Push also offers 3rds (each row a third higher) and Sequential (the notes run on from row to row).","see":["in-key","layout"]},{"id":"fixed","term":"Fixed","short":"A Scale option that keeps the notes in the same pads when you change key.","more":"With Fixed off, the root of the new key moves to the bottom-left pad.","see":["in-key"]},{"id":"root-pad","term":"Root Pad","short":"A pad that plays the key’s root; it is lit in the track’s colour.","more":"Notes in the scale are white; in Chromatic, notes outside it are unlit.","see":["in-key","root"]},{"id":"mpe","term":"MPE","short":"MIDI Polyphonic Expression: per-note pressure, slide and pitch bend, so each finger shapes its own note.","more":"Push’s pads send MPE by default; Poly Aftertouch and Mono Aftertouch are the other expression modes in Setup.","see":["pressure","slide","pitch-bend"]},{"id":"pressure","term":"Pressure","short":"Pressing harder into a pad after the note starts — aftertouch.","more":"Map it to filter, volume or vibrato so a held note can swell.","see":["mpe"]},{"id":"slide","term":"Slide","short":"Moving a finger up or down on a pad while it is held: the MPE dimension often mapped to timbre.","more":"Slide Height in Setup sets how far the finger has to move.","see":["mpe"]},{"id":"pitch-bend","term":"Pitch Bend","short":"Bending a note’s pitch: per-note by rocking the finger on an MPE pad, or the whole track with the touch strip.","more":"","see":["mpe","touch-strip"]},{"id":"velocity","term":"Velocity","short":"How hard a note is struck, from 1 to 127. Usually louder and brighter as it rises.","more":"Pad Sensitivity in Setup (Threshold, Drive, Compand, Range) shapes how your hits map to velocity.","see":["accent","pad-sensitivity"]},{"id":"pad-sensitivity","term":"Pad Sensitivity","short":"The Setup page that shapes how the pads turn force into velocity.","more":"Threshold, Drive, Compand and Range; Reset returns them to default.","see":["velocity"]},{"id":"accent","term":"Accent","short":"A switch that makes every played or stepped note full velocity, 127.","more":"Tap to latch it on; hold it for just a moment.","see":["velocity"]},{"id":"note-repeat","term":"Repeat","short":"Hold a pad and Push plays it again and again at the rate you choose.","more":"The Scenes & Repeat Intervals buttons set the rate, from quarter notes to 1/32, with triplets. Pressure still shapes each repeat.","see":["step-size"]},{"id":"scale-menu","term":"Scale (button)","short":"Push’s menu for the key, the scale, In Key / Chromatic, Fixed and the 4ths / 3rds / Sequential layout.","more":"The choice is saved with the Set; in Live 12 it is also the clip’s scale.","see":["in-key","scale-awareness"]},{"id":"octave-buttons","term":"Octave Up / Down","short":"Move the pads by an octave. Shift + Octave moves them by one scale note.","more":"On a Drum Rack they move the pad overview by 16 pads; in Session, by 8 scenes.","see":["note-mode"]},{"id":"drum-rack","term":"Drum Rack","short":"Live’s drum instrument: up to 128 pads, each a MIDI note with its own chain of devices.","more":"The first pad is C1. Push shows 16 at a time in the Loop Selector, or up to 64 in the 64 Pads layout.","see":["loop-selector","chain","simpler"]},{"id":"loop-selector","term":"Loop Selector","short":"The Drum Rack layout with 16 pads bottom-left, steps across the top and loop-length pads bottom-right.","more":"The upper half is a step sequencer for the selected pad.","see":["step-sequencer","drum-rack"]},{"id":"sixteen-velocities","term":"16 Velocities","short":"A Drum Rack layout where 16 pads play the selected sound at 16 different velocities.","more":"Good for ghost notes and hi-hat dynamics.","see":["velocity"]},{"id":"sixty-four-pads","term":"64 Pads","short":"A Drum Rack layout with every filled pad on the grid, up to 64 — for finger drumming and big kits.","more":"","see":["drum-rack"]},{"id":"step-sequencer","term":"Step Sequencer","short":"Programming notes by turning steps on, one grid square per slice of time.","more":"Push has one for drums (Loop Selector) and one for pitches (Melodic Sequencer). Hold a step to edit its velocity, length and nudge.","see":["step","step-size","melodic-sequencer"]},{"id":"step","term":"Step","short":"One square of a step sequencer: a note that is either on or off at one point in the bar.","more":"Hold a step and turn encoders to set its velocity, length and nudge; hold Mute and press it to switch it off without deleting.","see":["step-sequencer"]},{"id":"step-size","term":"Step Size","short":"How much time one step stands for: 1/16 by default; set it with the Scenes & Repeat Intervals buttons.","more":"Triplet sizes leave some columns unlit, because three don’t divide into eight.","see":["note-repeat","triplet"]},{"id":"melodic-sequencer","term":"Melodic Sequencer","short":"A step sequencer for pitches: each row a note, each column a step.","more":"The + 32 Notes version splits the grid: steps above, playable notes below.","see":["step-sequencer","layout"]},{"id":"capture","term":"Capture","short":"Turning what you just played into a clip, even though you were not recording.","more":"Live always listens to armed MIDI tracks. If the transport was stopped, Capture also guesses the tempo and the loop.","see":["clip","arm"]},{"id":"fixed-length","term":"Fixed Length","short":"A switch that makes new clips record a set number of bars and then loop.","more":"Hold it to choose the length or turn on Phrase Sync. When it is off, recording runs until you stop it.","see":["loop"]},{"id":"double-loop","term":"Double Loop","short":"Doubles a clip’s loop and the notes inside it, so you can change the second half.","more":"","see":["loop"]},{"id":"convert","term":"Convert","short":"Push’s button for moving a sound to a different home.","more":"Simpler → Drum Rack; slices → one pad each; a drum pad → its own Simpler; audio → MIDI with Melody, Harmony or Drums to MIDI.","see":["simpler","audio-to-midi","slicing"]},{"id":"duplicate","term":"Duplicate","short":"Copies a clip, a scene, a pad or a track.","more":"In Scene Workflow it makes a new scene from what is playing; in Clip Workflow it copies the clip to the next slot (set in Preferences).","see":["scene"]},{"id":"lock","term":"Lock","short":"Keeps Mute, Solo or Stop Clip on the lower display buttons so you can keep using it.","more":"","see":["display-buttons"]},{"id":"hot-swap","term":"Hot-Swap","short":"Replacing a device or preset in place, by browsing — Push’s Swap button.","more":"Everything around it stays: the track, the clip, the effects after it.","see":["browser","preset"]},{"id":"user-mode","term":"User Mode","short":"Push with its own functions switched off, so the controls can send MIDI for your own mappings.","more":"","see":["midi-map"]},{"id":"live","term":"Live","short":"Ableton’s music software: a recorder, sequencer, instrument and performance tool in one.","more":"It has two views of the same Set — Session for ideas and performance, Arrangement for the finished song.","see":["session-view","arrangement-view","set"]},{"id":"set","term":"Set","short":"A Live document: the tracks, clips, devices and arrangement you save as one file (.als).","more":"Collect All and Save puts every sample it uses in the project folder, so it opens anywhere.","see":["project","collect-all"]},{"id":"project","term":"Project","short":"The folder that holds one or more Sets and the samples and recordings they use.","more":"","see":["set"]},{"id":"collect-all","term":"Collect All and Save","short":"Copies every sample a Set uses into its project folder, so nothing goes missing.","more":"","see":["set","project"]},{"id":"session-view","term":"Session View","short":"Live’s grid of clips: tracks are columns, scenes are rows, and any clip can be launched any time.","more":"It is for jamming, sketching and performing — loops you can rearrange on the fly.","see":["clip","scene","arrangement-view"]},{"id":"arrangement-view","term":"Arrangement View","short":"Live’s timeline: the song laid out left to right, from start to finish.","more":"Record a Session performance into it, then edit, comp and automate the result.","see":["session-view","automation"]},{"id":"track","term":"Track","short":"One lane of sound with its own devices and mixer controls.","more":"MIDI tracks hold notes and an instrument; audio tracks hold recorded sound; return tracks take sends; the Main track is the sum.","see":["midi-track","audio-track","return-track"]},{"id":"midi-track","term":"MIDI Track","short":"A track that holds notes and plays them through an instrument.","more":"","see":["track","midi","instrument"]},{"id":"audio-track","term":"Audio Track","short":"A track that holds recorded or imported sound.","more":"","see":["track","audio-clip"]},{"id":"return-track","term":"Return Track","short":"A track fed by sends from other tracks — the place for one shared reverb or delay.","more":"","see":["send","track"]},{"id":"main-track","term":"Main Track","short":"The sum of everything: the track whose output you hear (called Master before Live 12).","more":"","see":["track"]},{"id":"group-track","term":"Group Track","short":"A track that holds other tracks, so you can fold them away and process them together.","more":"","see":["track"]},{"id":"clip","term":"Clip","short":"A piece of music in a slot: MIDI notes or audio, usually looping.","more":"In Session, clips launch in time with the song; in Arrangement they sit on the timeline.","see":["midi-clip","audio-clip","loop"]},{"id":"midi-clip","term":"MIDI Clip","short":"A clip of notes — pitch, timing, velocity and length — played by the track’s instrument.","more":"","see":["clip","midi"]},{"id":"audio-clip","term":"Audio Clip","short":"A clip of recorded sound, stretched to the tempo by warping.","more":"","see":["clip","warp"]},{"id":"clip-slot","term":"Clip Slot","short":"A cell in the Session grid, empty or holding a clip; an empty slot has a small stop square.","more":"","see":["session-view"]},{"id":"scene","term":"Scene","short":"A row of the Session: launching it starts every clip in that row at once.","more":"Scenes make natural song sections — intro, verse, drop.","see":["session-view","clip-launch"]},{"id":"clip-launch","term":"Clip Launch","short":"Starting a clip; it waits for the launch quantization, so it lands in time.","more":"","see":["launch-quantization","scene"]},{"id":"launch-quantization","term":"Launch Quantization","short":"The grid launched clips wait for: by default the next bar.","more":"","see":["clip-launch","quantize"]},{"id":"follow-actions","term":"Follow Actions","short":"Rules that make one clip launch another after it plays — next, previous, any, other.","more":"Good for variation that changes on its own, and for chaining scenes into a song.","see":["clip","scene"]},{"id":"loop","term":"Loop","short":"The part of a clip that repeats; set by its loop start and length.","more":"","see":["clip","fixed-length"]},{"id":"arm","term":"Arm","short":"Making a track ready to record (the record-arm button lights red).","more":"Live also routes your playing to an armed MIDI track’s instrument, so you hear it — and Capture can catch it.","see":["capture","overdub"]},{"id":"overdub","term":"Overdub","short":"Recording on top of a clip without erasing what is in it.","more":"On Push, the third press of Record turns overdub on.","see":["arm"]},{"id":"metronome","term":"Metronome","short":"The click that marks the beat while you play or record.","more":"Hold Metronome on Push for its sound and rhythm options.","see":["tempo","count-in"]},{"id":"count-in","term":"Count-in","short":"Bars of metronome before recording starts, so you come in on time.","more":"","see":["metronome"]},{"id":"tempo","term":"Tempo","short":"The speed of the beat, in beats per minute (BPM).","more":"On Push: the Swing and Tempo encoder, or Tap Tempo.","see":["tap-tempo","warp"]},{"id":"tap-tempo","term":"Tap Tempo","short":"Setting the tempo by tapping a button in time.","more":"","see":["tempo"]},{"id":"swing","term":"Swing","short":"Delaying every other note a little so straight notes lean into a shuffle.","more":"Push’s Swing encoder sets it from 0 to 100%; it is applied when you quantize or step-sequence.","see":["groove","quantize"]},{"id":"quantize","term":"Quantize","short":"Moving notes (or audio transients) toward the nearest grid line.","more":"Quantize Amount below 100% tightens the timing but keeps some feel.","see":["swing","groove","record-quantization"]},{"id":"record-quantization","term":"Record Quantization","short":"Quantizing notes as they are recorded.","more":"On Push, hold Quantize for Rec. Quantize.","see":["quantize"]},{"id":"groove","term":"Groove","short":"A timing and velocity template from a real performance, applied to clips to give them feel.","more":"Live’s Groove Pool holds them; commit a groove to write it into the notes.","see":["swing","quantize"]},{"id":"warp","term":"Warp","short":"Stretching audio to the Set’s tempo without changing its pitch.","more":"Warp markers pin points of the audio to beats; the warp mode — Beats, Tones, Texture, Complex — suits the material.","see":["warp-mode","audio-clip","tempo"]},{"id":"warp-mode","term":"Warp Mode","short":"The algorithm Live uses to stretch audio — Beats, Tone, Texture, Repitch, Complex, Pro: Beats for drums, Tone for single notes, Complex and Pro for full mixes, Repitch like tape.","more":"On Push, Clip View shows the warp mode of an audio clip.","see":["warp"]},{"id":"transient","term":"Transient","short":"The sharp start of a sound — a drum hit, a pluck — that Live marks when it analyses audio.","more":"","see":["warp","slicing"]},{"id":"device","term":"Device","short":"Anything in a track’s chain that makes or changes sound: an instrument, an audio effect, a MIDI effect.","more":"","see":["instrument","audio-effect","midi-effect"]},{"id":"device-view","term":"Device View","short":"On Push, the selected track’s devices on the display and their parameters on the encoders.","more":"","see":["device","encoder"]},{"id":"instrument","term":"Instrument","short":"A device that turns MIDI notes into sound — Drift, Wavetable, Operator, Meld, Simpler, Sampler.","more":"","see":["device","midi-track"]},{"id":"audio-effect","term":"Audio Effect","short":"A device that changes sound — EQ Eight, Compressor, Reverb, Delay, Auto Filter, Roar.","more":"","see":["device"]},{"id":"midi-effect","term":"MIDI Effect","short":"A device that changes notes before they reach the instrument — Arpeggiator, Chord, Scale, Note Length.","more":"","see":["device","arpeggiator"]},{"id":"rack","term":"Rack","short":"A device that holds other devices in parallel chains, with Macro knobs on the front.","more":"Instrument, Audio Effect, MIDI Effect and Drum Racks.","see":["chain","macro","drum-rack"]},{"id":"chain","term":"Chain","short":"One lane of devices inside a Rack; a Drum Rack has one chain per pad.","more":"","see":["rack"]},{"id":"macro","term":"Macro","short":"A knob on a Rack that turns many parameters at once.","more":"Map a filter, a reverb amount and a drive to one macro, and one encoder on Push plays all three.","see":["rack","encoder"]},{"id":"preset","term":"Preset","short":"A saved setting of a device or rack, loaded from the browser.","more":"","see":["browser","hot-swap"]},{"id":"browser","term":"Browser","short":"Where Live keeps sounds, instruments, effects, samples, Packs and your User Library.","more":"On Push, Add opens it; Swap uses it to replace what is selected.","see":["pack","user-library","hot-swap"]},{"id":"pack","term":"Pack","short":"A bundle of instruments, presets and samples from Ableton or others, installed into the browser.","more":"","see":["browser"]},{"id":"user-library","term":"User Library","short":"Your own folder of presets, samples and clips in the browser.","more":"","see":["browser"]},{"id":"simpler","term":"Simpler","short":"Live’s easy sampler: one sample, played in Classic, One-Shot or Slicing mode.","more":"","see":["sampler","slicing","convert"]},{"id":"sampler","term":"Sampler","short":"Live’s deep sampler: many samples across keys and velocities, with modulation.","more":"","see":["simpler"]},{"id":"slicing","term":"Slicing","short":"Simpler’s mode that cuts a sample at its transients (or a grid) and puts each slice on its own note.","more":"","see":["simpler","transient","convert"]},{"id":"drift","term":"Drift","short":"Live’s compact analog-style synthesizer, light on the processor and quick to shape from Push.","more":"","see":["instrument"]},{"id":"wavetable","term":"Wavetable","short":"Live’s synthesizer that scans through tables of waveforms for moving tones.","more":"","see":["instrument"]},{"id":"meld","term":"Meld","short":"A two-engine MPE synthesizer that came with Live 12, built for expressive playing.","more":"","see":["instrument","mpe"]},{"id":"roar","term":"Roar","short":"Live 12’s saturation and distortion effect, with stages in series, parallel or multiband.","more":"","see":["audio-effect"]},{"id":"arpeggiator","term":"Arpeggiator","short":"A MIDI effect that plays held chords as a pattern of single notes.","more":"","see":["midi-effect"]},{"id":"envelope","term":"Envelope","short":"A shape over time — attack, decay, sustain, release — that drives volume, a filter or anything else.","more":"","see":["lfo"]},{"id":"lfo","term":"LFO","short":"A low-frequency oscillator: a slow wave that moves a parameter back and forth.","more":"","see":["envelope","modulation"]},{"id":"modulation","term":"Modulation","short":"One signal moving a parameter — an LFO opening a filter, pressure adding vibrato.","more":"","see":["lfo","mpe"]},{"id":"filter","term":"Filter","short":"Cuts some frequencies and lets others through: low-pass darkens, high-pass thins.","more":"","see":["modulation"]},{"id":"sidechain","term":"Sidechain","short":"Letting one sound control an effect on another — the kick ducking the bass through a compressor.","more":"","see":["compressor"]},{"id":"compressor","term":"Compressor","short":"An effect that turns loud parts down, evening out levels and adding punch.","more":"","see":["sidechain"]},{"id":"resampling","term":"Resampling","short":"Recording Live’s own output to a new audio track, to turn processed sound into new raw material.","more":"","see":["freeze","audio-track"]},{"id":"freeze","term":"Freeze","short":"Rendering a track to audio in place to save processor, while keeping it editable.","more":"Flatten makes the freeze permanent: the devices are replaced by the audio.","see":["flatten","resampling"]},{"id":"flatten","term":"Flatten","short":"Replacing a frozen track’s devices with its rendered audio, for good.","more":"","see":["freeze"]},{"id":"consolidate","term":"Consolidate","short":"Joining a selection of clips (and the gaps) into one new clip.","more":"","see":["clip"]},{"id":"audio-to-midi","term":"Audio to MIDI","short":"Turning recorded sound into notes: Melody, Harmony or Drums to MIDI.","more":"On Push, Convert on an audio track offers all three.","see":["convert"]},{"id":"mixer","term":"Mixer","short":"Each track’s volume, pan, sends and on/off — on Push, Mix mode.","more":"","see":["send","pan"]},{"id":"pan","term":"Pan","short":"Where a sound sits between the left and right speakers.","more":"","see":["mixer"]},{"id":"send","term":"Send","short":"A knob that taps some of a track’s signal off to a return track.","more":"","see":["return-track"]},{"id":"mute","term":"Mute","short":"Silencing a track, a drum pad, a step or a device, without deleting it.","more":"","see":["solo"]},{"id":"solo","term":"Solo","short":"Hearing only one track (or drum pad) — everything else goes quiet.","more":"","see":["mute"]},{"id":"headroom","term":"Headroom","short":"The space between your loudest peak and 0 dB, where clipping starts.","more":"","see":["clipping"]},{"id":"clipping","term":"Clipping","short":"Distortion from a signal going over 0 dB at the output.","more":"","see":["headroom"]},{"id":"automation","term":"Automation","short":"Recorded movement of a parameter over time.","more":"On Push, turn Automate on and move an encoder; automated parameters show a white dot.","see":["clip-envelope","encoder"]},{"id":"clip-envelope","term":"Clip Envelope","short":"Automation that lives inside a clip and loops with it.","more":"","see":["automation"]},{"id":"midi","term":"MIDI","short":"Instructions, not sound: which note, how hard, how long. An instrument turns them into audio.","more":"","see":["midi-clip","velocity"]},{"id":"note","term":"Note","short":"A pitch with a start and a length; on a MIDI clip, a bar in the piano roll.","more":"","see":["midi"]},{"id":"octave","term":"Octave","short":"The same note name, twice (or half) the frequency — 12 half steps.","more":"Live names middle C as C3, so the bottom-left pad, MIDI note 36, is C1.","see":["note"]},{"id":"half-step","term":"Half Step","short":"The smallest step in Western music: one pad across in Chromatic, one key on a piano.","more":"","see":["octave"]},{"id":"scale","term":"Scale","short":"A set of notes from a root: the major scale, minor, Dorian, the pentatonics.","more":"","see":["key","in-key","mode"]},{"id":"key","term":"Key","short":"The scale and root a piece lives in — C minor, F major.","more":"","see":["scale","root"]},{"id":"root","term":"Root","short":"The note a key or chord is named for, and where it feels at home.","more":"","see":["root-pad"]},{"id":"mode","term":"Mode","short":"A scale started from a different degree of the major scale: Dorian, Phrygian, Lydian, Mixolydian, Locrian.","more":"","see":["scale"]},{"id":"chord","term":"Chord","short":"Three or more notes at once.","more":"","see":["triad"]},{"id":"triad","term":"Triad","short":"A three-note chord: root, third, fifth.","more":"On Push in In Key, every triad of the key is the same shape: a pad, two to the right, and one up and one right.","see":["chord","in-key"]},{"id":"bar","term":"Bar","short":"A unit of beats — four in 4/4. Clips loop in bars.","more":"","see":["beat"]},{"id":"beat","term":"Beat","short":"The pulse you count. In 4/4, four to a bar; a sixteenth step is a quarter of a beat.","more":"","see":["bar","step-size"]},{"id":"triplet","term":"Triplet","short":"Three notes in the space of two.","more":"","see":["step-size"]},{"id":"backbeat","term":"Backbeat","short":"The snare on beats 2 and 4.","more":"","see":["beat"]},{"id":"four-on-the-floor","term":"Four on the Floor","short":"A kick on every beat — the engine of house and techno.","more":"","see":["backbeat"]},{"id":"scale-awareness","term":"Scale Awareness","short":"Live 12’s idea that a clip can have a key and scale which devices and the editor follow.","more":"Set it on Push with Scale; in Live, clips, MIDI effects and some instruments can fold to it.","see":["scale-menu","midi-tools"]},{"id":"midi-tools","term":"MIDI Transformations & Generators","short":"Live 12 tools in the clip view that reshape notes (Arpeggiate, Ornament, Strum…) or invent them (Rhythm, Seed, Stacks, Shape).","more":"","see":["scale-awareness","midi-clip"]},{"id":"link","term":"Link","short":"Ableton’s way of syncing tempo between apps and devices on the same network.","more":"","see":["tempo"]},{"id":"midi-map","term":"MIDI Map","short":"Assigning a hardware knob or button to a parameter in Live.","more":"","see":["user-mode"]},{"id":"stem-separation","term":"Stem Separation","short":"Live 12.3’s tool that splits a mixed audio file into vocals, drums, bass and the rest.","more":"","see":["audio-clip"]},{"id":"launch-mode","term":"Launch Mode","short":"How a clip answers a press: Trigger (the default), Gate (plays while held), Toggle (press to start, press to stop), Repeat (retriggers while held).","more":"Set in Live’s Clip View under Launch; Push follows it.","see":["clip-launch","legato"]},{"id":"legato","term":"Legato","short":"A launch option: a new clip on the track continues from the old clip’s position instead of starting at its beginning.","more":"Switch between two variations mid-bar and they stay in step.","see":["launch-mode"]},{"id":"global-quantization","term":"Global Quantization","short":"The grid every launched clip waits for, set in Live’s Control Bar: 1 Bar by default, from None to 8 Bars.","more":"A clip can override it with its own launch quantization.","see":["launch-quantization","clip-launch"]},{"id":"back-to-arrangement","term":"Back to Arrangement","short":"The orange button that lights when Session clips are overriding what is in the Arrangement; press it to hear the timeline again.","more":"","see":["arrangement-view","session-view"]},{"id":"loop-brace","term":"Loop Brace","short":"The region of the Arrangement that repeats when Loop is on — handy for working on one section.","more":"","see":["arrangement-view","loop"]},{"id":"per-step-automation","term":"Per-Step Automation","short":"Hold a step and turn a device encoder: the parameter takes that value for the time of that step, even if the step has no note.","more":"The manual’s rule: the value is adjusted specifically for the time represented by that step.","see":["automation","step","clip-envelope"]},{"id":"nudge","term":"Nudge","short":"Moving a note or a step a little before or after its grid line, for feel.","more":"Hold a step and turn Nudge; in Clip View, Nudge is one of the note controls.","see":["step","swing"]},{"id":"note-length","term":"Note Length","short":"How long a note lasts. On a held step, Length; in Clip View, Length for the selected notes.","more":"","see":["step","nudge"]},{"id":"loop-length","term":"Loop Length","short":"How many pages a step-sequenced clip loops over; set with the loop length pads at the bottom right of the Loop Selector.","more":"Hold one loop length pad and tap another to span pages; double-tap one for a single page.","see":["loop-selector","loop"]},{"id":"phrase-sync","term":"Phrase Sync","short":"A Fixed Length option: Push treats the chosen length as a phrase and starts recording at the matching position inside it.","more":"With 4 bars chosen and the transport at bar 7, recording starts at the clip’s third bar.","see":["fixed-length"]},{"id":"probability","term":"Probability","short":"The chance, per pass, that a note plays — one of Clip View’s note controls on Push.","more":"Set a hat to 50% and it plays about half the loops.","see":["step","velocity"]},{"id":"oscillator","term":"Oscillator","short":"The part of a synthesizer that makes the raw tone: a repeating wave, named for its shape (sine, saw, square) or its table.","more":"","see":["instrument","filter","envelope"]},{"id":"operator","term":"Operator","short":"Live’s FM synthesizer: four operators (A, B, C, D) connected by one of eleven algorithms, in series for FM or in parallel for additive tones.","more":"","see":["fm-synthesis","instrument"]},{"id":"fm-synthesis","term":"FM Synthesis","short":"Frequency modulation: one oscillator wobbles the pitch of another fast enough to create new harmonics — bells, electric pianos, metallic basses.","more":"","see":["operator","oscillator"]},{"id":"unison","term":"Unison","short":"Several copies of a voice, slightly detuned, played together for width and thickness.","more":"Drift has a Unison voice mode; Wavetable has several unison modes.","see":["drift","wavetable","oscillator"]},{"id":"sub-oscillator","term":"Sub Oscillator","short":"A simple low oscillator under the main ones, an octave down, for weight without mud.","more":"","see":["oscillator","wavetable"]},{"id":"wavetable-position","term":"Wavetable Position","short":"Where in the table a Wavetable oscillator is reading; move it and the tone morphs — the control that gives the device its sound.","more":"","see":["wavetable","modulation"]},{"id":"eq-eight","term":"EQ Eight","short":"Live’s eight-band equalizer: cut what a track does not need, boost gently.","more":"A high-pass on everything but kick and bass cleans a mix.","see":["audio-effect","filter"]},{"id":"glue-compressor","term":"Glue Compressor","short":"A bus compressor modelled on a classic console design, for gluing a drum group or a whole mix together.","more":"","see":["compressor","group-track"]},{"id":"limiter","term":"Limiter","short":"A compressor with a ceiling: nothing passes above the level you set. Last on the Main track, used gently.","more":"","see":["compressor","clipping"]},{"id":"reverb","term":"Reverb","short":"The sound of a room added to a signal. Usually one, on a return track, shared by sends.","more":"","see":["send","return-track"]},{"id":"delay","term":"Delay","short":"A repeating echo in time with the tempo; Echo is the coloured, modulated sibling.","more":"","see":["return-track","audio-effect"]},{"id":"auto-filter","term":"Auto Filter","short":"Live’s filter with an envelope follower and an LFO: sweeps, wobbles and builds.","more":"The classic Push move: its cutoff on an encoder with Automate on.","see":["filter","lfo","automation"]},{"id":"monitoring","term":"Monitoring","short":"Whether a track lets you hear its live input: In (always), Auto (only while armed), Off (never).","more":"The first encoder of Track Mix Mode’s Input & Output page on Push.","see":["arm","routing"]},{"id":"routing","term":"Routing","short":"Where a track’s signal comes from and goes to: Input Type and Channel, Output Type and Channel, and the tap point (Pre FX, Post FX, Post Mixer) when the source is another track.","more":"Set it in Live’s In/Out section or in Track Mix Mode on Push.","see":["monitoring","resampling","send"]},{"id":"global-mix-mode","term":"Global Mix Mode","short":"Press Mix once: the encoders adjust volume, pan or a send across the eight visible tracks; the upper display buttons choose which.","more":"Volumes and pans always stay visible; Input & Output here reaches the Main track and Cue outputs.","see":["mixer","track-mix-mode"]},{"id":"track-mix-mode","term":"Track Mix Mode","short":"Press Mix twice: everything about the selected track — its Mix page and its Input & Output page, chosen with the two leftmost upper display buttons.","more":"","see":["global-mix-mode","routing"]},{"id":"midi-in","term":"MIDI In (the Listen page)","short":"This book’s listening page: notes arriving from Push 3 or any MIDI keyboard light the pad grid and are named as chords and a key.","more":"iPadOS Safari has no Web MIDI, so there the page listens to the pads you tap instead.","see":["chord-quality","key","pad-grid"]},{"id":"chord-quality","term":"Chord Quality","short":"What kind of chord sits on a root: major, minor, 7, maj7, sus4… the notes above the root decide it.","more":"The Listen page names chords from the notes you hold.","see":["chord","triad","roman-numerals"]},{"id":"roman-numerals","term":"Roman Numerals","short":"Chords named by their place in the key: I IV V major, ii iii vi minor, vii° diminished. The same numerals work in every key.","more":"","see":["chord-quality","progression","key"]},{"id":"progression","term":"Progression","short":"The order of chords under a loop or a song: I–V–vi–IV, ii–V–I. The Listen page suggests the next chord from a library of them.","more":"","see":["roman-numerals","chord"]}],"aliases":{"pads":"pad-grid","pad":"pad-grid","encoders":"encoder","clips":"clip","scenes":"scene","tracks":"track","devices":"device","racks":"rack","macros":"macro","presets":"preset","session":"session-view","arrangement":"arrangement-view","sends":"send","return tracks":"return-track","midi effects":"midi-effect","audio effects":"audio-effect","instruments":"instrument","steps":"step","quantizing":"quantize","warping":"warp","automated":"automation","drum racks":"drum-rack","repeat":"note-repeat","the browser":"browser","main":"main-track","swap":"hot-swap","chains":"chain","scales":"scale","keys":"key","octaves":"octave","triads":"triad","chords":"chord","bpm":"tempo","in key layout":"in-key","sets":"set","beats":"beat","bars":"bar","launch modes":"launch-mode","oscillators":"oscillator","fm":"fm-synthesis","progressions":"progression","roman numeral":"roman-numerals","nudged":"nudge","monitor":"monitoring","loop length pads":"loop-length","web midi":"midi-in","per-step":"per-step-automation","global mix":"global-mix-mode","track mix":"track-mix-mode","tap point":"routing","tap points":"routing"},"theory":{"facts":[{"t":"Two ways to run","b":"Push 3 can be the computer: in Standalone Mode it runs Live’s engine on its own processor. Plugged into a computer it switches to Control Mode and plays Live there. The same Sets travel between the two.","tag":"push"},{"t":"Everything is a mode","b":"The pads, encoders and display change job with the mode buttons: Note plays, Session launches, Device shapes sound, Mix balances, Clip edits. Learn the six and Push stops being a wall of buttons.","tag":"push"},{"t":"Hold, then press","b":"Push grammar: hold a verb, press a noun. Hold Delete, press a clip. Hold Duplicate, press a pad. Hold Mute, press a step. The same verbs work on tracks, pads, clips, devices and steps.","tag":"push"},{"t":"Shift is the second page","b":"Many buttons have a second job under Shift: Shift + Undo redoes, Shift + Save saves a new version, Shift + Stop Clip stops everything, and Shift with an encoder gives fine steps.","tag":"push"},{"t":"Two views, one Set","b":"Session View is a grid of loops you launch in any order; Arrangement View is a timeline. They share the same tracks and devices. Sketch in Session, then record the performance into the Arrangement and finish it there.","tag":"live"},{"t":"Clips wait their turn","b":"A launched clip does not start at once — it waits for the launch quantization, normally the next bar — so whatever you press lands in time. That is why Session works as an instrument.","tag":"live"},{"t":"MIDI is the score, the instrument is the player","b":"A MIDI clip holds no sound: only which notes, when, how hard and how long. Change the instrument and the same clip plays a new sound. Audio clips hold the sound itself.","tag":"live"},{"t":"Racks make one knob do many things","b":"Put devices in a Rack and map their settings to the eight Macros. On Push, eight encoders then play a whole sound — a filter sweep that also adds drive and reverb on one turn.","tag":"live"},{"t":"Bottom-left is C1","b":"Live names middle C as C3, one octave lower than some other programs. So MIDI note 36 — the bottom-left pad in Note Mode, and the first pad of every Drum Rack — is C1.","tag":"notes"},{"t":"Up a row is a fourth","b":"In the default 4ths layout each row is a fourth above the one below; across a row is the next scale note in In Key, or the next half step in Chromatic. In In Key the eighth pad of a row is the octave.","tag":"notes"},{"t":"One shape for every chord","b":"In In Key, every triad of the key is the same shape: a pad, the pad two to the right (the third), and the pad one up and one right (the fifth). Two rows straight up is the seventh. Move the shape and the chord changes, but it always fits the key.","tag":"notes"},{"t":"Chromatic keeps shapes, In Key keeps you safe","b":"In Chromatic, a major chord is the same shape in every key and every pad is available. In In Key, wrong notes are gone but a shape is major or minor depending on where it sits. Pick by what you are doing: writing in a key, or chasing outside notes.","tag":"notes"},{"t":"Fingers as faders","b":"With MPE, each held pad sends its own pressure, slide and pitch bend. Map them in Meld, Drift or Wavetable and every note in a chord can swell or bend on its own.","tag":"notes"},{"t":"Sixteen pads, sixteen notes","b":"A Drum Rack maps each pad to a MIDI note from C1 upward. The Loop Selector shows 16 at once in a 4 × 4 block; Octave buttons slide that window by 16.","tag":"drums"},{"t":"Steps are sixteenths until you say otherwise","b":"In the step sequencer a step is a 1/16 note by default — four to a beat, sixteen to a bar. The Scenes & Repeat Intervals buttons change the size; triplet sizes leave columns unlit.","tag":"drums"},{"t":"Four beats you should know","b":"Four on the floor: a kick on every beat. The backbeat: snare on 2 and 4. Half-time: the snare on 3. The two-step: no kick on 3. Most dance and pop drums are one of these with decoration.","tag":"drums"},{"t":"Swing is late off-beats","b":"Swing pushes every second step later. At 50% swing on sixteenths, the off-beat sixteenths drift toward a triplet feel. Boom bap and garage live there.","tag":"drums"},{"t":"Velocity is the groove","b":"A hat line at one velocity sounds like a machine. Use 16 Velocities, or hold a step and turn its velocity, and let some hits whisper.","tag":"drums"},{"t":"Three presses of Record","b":"On Push, Record starts recording, the second press stops recording and keeps playing the loop, and the third turns on overdub — so you can stack a part pass after pass.","tag":"record"},{"t":"You were already recording","b":"Live keeps listening to armed MIDI tracks. Capture turns the last thing you played into a clip, and from a stopped transport it even detects the tempo and loop length.","tag":"record"},{"t":"Fixed Length makes loops","b":"With Fixed Length on, a take records exactly the bars you chose and then loops. Off, recording runs until you press New, Record or Play.","tag":"record"},{"t":"Quantize a little","b":"Quantize at 100% puts every note on the grid. Lower the amount and notes move only part of the way — tight, but still human.","tag":"record"},{"t":"Convert moves sounds between homes","b":"Convert on Push turns a Simpler into a Drum Rack, slices into separate pads, a drum pad into its own Simpler, or audio into MIDI. It is the bridge between sampling and sequencing.","tag":"sound"},{"t":"Swap keeps everything else","b":"Hot-Swap replaces only the selected device or preset; the clip, the track and the effects after it stay. Try ten basses in a minute.","tag":"sound"},{"t":"Resample your own sounds","b":"Route Live’s output to a new audio track and record: the processed result becomes raw material to chop, reverse and play — the habit behind a lot of electronic music.","tag":"sound"},{"t":"Freeze to save power","b":"Freeze renders a track to audio in place so it costs almost no processor; unfreeze to edit. Flatten makes it permanent. Useful in Standalone Mode.","tag":"sound"},{"t":"Sends for space","b":"Put one reverb on a return track and send a little of each track to it. They share a room, which glues the mix — and it costs one reverb, not twelve.","tag":"mix"},{"t":"Gain before glory","b":"Leave headroom: if the Main track peaks near 0 dB before mastering, everything after has nowhere to go. Turn tracks down, not the Main track up.","tag":"mix"},{"t":"Automation is a performance","b":"With Automate on, every encoder move is recorded. Play a filter sweep live into a clip and it plays back the same way every time — or hold Delete and touch the encoder to start over.","tag":"mix"},{"t":"Session to song","b":"Duplicate a scene, change one clip, and you have the next section. Launch the scenes in order while recording into the Arrangement and the song writes itself as a timeline.","tag":"workflow"},{"t":"Save versions, not over yourself","b":"Shift + Save keeps a new version of the Set beside the old one. Big changes stop being risky when the last good version is one tap away.","tag":"workflow"},{"t":"Finish loops by subtracting","b":"An eight-bar const courseGot = () => store.get('course.cleared', {});
const courseClear = id => { const c = courseGot(); c[id] = true; store.set('course.cleared', c); };
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const sample = (a, n) => shuffle(a).slice(0, n);

// right: a bright major-seventh stab rising; wrong: two low detuned saws — both on the scenes' SFX bus (scene.js)
const sfx = ok => Music.fx(ok ? 'attack' : 'foe');

// Build a chapter quiz: mostly the chapter's topic, with a few review questions woven in from the previous chapter.
function buildQuiz(primary, review, n) {
  const out = [], seen = new Set(); let g = 0;
  while (out.length < n && g++ < 1500) {
    const useReview = review.length && out.length >= 3 && Math.random() < 0.2;
    const pool = useReview ? review : primary, tp = pool[rnd(pool.length)], facs = QBANK[tp];
    if (!facs || !facs.length) continue;
    const Q = facs[rnd(facs.length)]();
    if (!Q || seen.has(Q.q)) continue; seen.add(Q.q); Q.topic = tp; if (useReview) Q.review = true; out.push(Q);
  }
  return shuffle(out);
}

/* a lesson is a take: one step per question along the top. A right answer records a bar (the meter fills, the step
   lights green); a wrong one clips (the step lights red, a headroom light goes out). Record every bar to keep the take;
   clip twice and it is lost. The recall bonus comes after a kept take and only adds. */
function quizView(v, ch, idx) {
  pageScroll = true;
  const id = ch.challenge ? 'challenge:' + ch.mod : chapKey(ch);
  const primary = ch.challenge ? ch.topics : ch.exam ? LESSONS.filter(c => c.topic).map(c => c.topic) : [ch.topic];
  const review = (!ch.exam && !ch.challenge && idx > 0 && LESSONS[idx - 1].topic) ? [LESSONS[idx - 1].topic] : [];
  const back = () => { const s = state('course', {}); s.open = -1; s.challenge = -1; keep('course', s); GAME = null; redraw(); };
  const again = () => { const s = state('course', {}); if (ch.challenge) s.challenge = ch.mod; else s.open = idx; keep('course', s); redraw(); };
  v.append(h('div', {class: 'toolbar'}, h('div', {class: 'quiz-name', style: `--c:${ch.acc}`}, h('i'), ch.name)));

  const wrap = h('div', {class: 'quiz'});
  v.append(wrap);
  const take = h('div', {class: 'take'});
  const strip = h('div', {class: 'qsteps', 'aria-hidden': 'true'});
  const meter = h('div', {class: 'take-meter'}, h('i'));
  const room = h('div', {class: 'take-room'});
  const bars = h('span', {class: 'label'});
  take.append(h('div', {class: 'take-row'}, h('span', {class: 'label'}, 'Headroom'), room, h('span', {class: 'sp'}), bars), meter, strip);
  const counter = h('div', {class: 'muted qcount'});
  const qh = h('div', {class: 'qtext'});
  const fig = h('div', {class: 'qfig'});
  const opts = h('div', {class: 'qopts'});
  const hintRow = h('div', {style: 'text-align:center;min-height:1.6em'});
  const fb = h('div', {'aria-live': 'polite', class: 'qfb'});

  const qs = buildQuiz(primary, review, ch.exam || ch.challenge ? 16 : 12);
  const gems = () => store.get('course.gems', 0);
  let bonusQ = null;
  if (!ch.exam && !ch.challenge && ch.mod > 0) {
    const early = LESSONS.filter(l => l.topic && l.mod < ch.mod && QBANK[l.topic]);
    if (early.length) { const src = early[rnd(early.length)], facs = QBANK[src.topic];
      for (let g = 0; g < 25 && !bonusQ; g++) { const Q = facs[rnd(facs.length)](); if (Q && !qs.some(x => x.q === Q.q)) bonusQ = Object.assign(Q, {bonus: true, from: src.modName, topic: src.topic}); } } }
  const need = qs.length - (HEARTS - 1);   // enough right answers to keep the take even after every clip but the last
  const ar = arena(ch.mod, wrap, need);    // the module's scene above the take: the foe track's meter drains per right answer
  wrap.append(take, counter, qh, fig, opts, hintRow, fb);
  const cells = qs.map(() => h('i')); strip.append(...cells);
  let i = 0, right = 0, hits = 0, streak = 0, answered = false, inBonus = false, hintShown = false, finished = false;
  const hud = () => { room.replaceChildren(headroom(HEARTS - hits, HEARTS)); meter.firstChild.style.width = (right / need * 100) + '%';
    bars.textContent = `${need - right} bar${need - right === 1 ? '' : 's'} to record`; };
  const showPts = (gain = 0) => { GAME_GAIN = gain; drawBar(); };
  const current = () => inBonus ? bonusQ : qs[i];
  GAME = {kind: 'take', name: ch.name, back, hearts: () => HEARTS - hits, max: HEARTS, items: () => { const Q = current(); return [
    {icon: '▤', label: 'Reference', cost: 0, ok: !finished && !!Q, title: 'A chart for this question — free, like an exam legend', use: () => showReference(Q)},
    {icon: '?', label: 'Hint', cost: HINT_COST, ok: !finished && !answered && !hintShown && !!(Q && Q.hint) && points() >= HINT_COST, title: points() < HINT_COST ? `Earn ${HINT_COST} points to buy a hint` : 'A nudge toward the answer',
      use: () => { addPoints(-HINT_COST); hintShown = true; Music.fx('bump'); hintRow.replaceChildren(h('span', {class: 'muted', style: 'font-size:14px;font-weight:700'}, 'Hint · ' + Q.hint)); showPts(-HINT_COST); }},
    {icon: '+', label: 'Heal', cost: HEAL_COST, ok: !finished && hits > 0 && points() >= HEAL_COST, title: hits ? (points() < HEAL_COST ? `Earn ${HEAL_COST} points to heal` : 'Win back a headroom light') : 'Your headroom is full',
      use: () => { addPoints(-HEAL_COST); hits--; Music.fx('bump'); hud(); showPts(-HEAL_COST); }}]; }};
  function render() {
    answered = false; hintShown = false; const Q = current();
    cells.forEach((c, k) => c.classList.toggle('now', !inBonus && k === i));
    counter.textContent = Q.bonus ? `◆ Bonus · from ${Q.from} · worth a gem` : `Question ${i + 1}` + (streak > 1 ? ` · ${streak} in a row` : '') + (Q.review ? ' · review' : '');
    qh.textContent = Q.q;
    fig.replaceChildren(); if (Q.svg) fig.append(h('div', {html: Q.svg}));
    if (Q.play) { fig.append(h('button', {class: 'btn small play', on: {click: () => { audio(); Q.play(); }}}, 'Hear it')); setTimeout(() => { audio(); Q.play(); }, 350); }
    opts.replaceChildren(...Q.opts.map(o => h('button', {class: 'btn qopt', on: {click: () => pick(o, Q)}}, String(o))));
    hintRow.replaceChildren(); fb.textContent = ''; hud(); drawBar(); }
  function pick(o, Q) { if (answered) return; answered = true;
    const ok = String(o) === String(Q.a); if (Q.bonus && ok) Music.fx('coin'); else sfx(ok);
    if (!Q.bonus) ar.hit(ok);
    [...opts.children].forEach(btn => { btn.disabled = true; if (btn.textContent === String(Q.a)) btn.classList.add('acc'); else if (btn.textContent === String(o) && !ok) btn.style.opacity = '.45'; });
    hintRow.replaceChildren();
    let gain = 0;
    if (Q.bonus) { if (ok) { store.set('course.gems', gems() + 1); addPoints(PTS_BONUS); gain = PTS_BONUS; } }
    else { cells[i].classList.remove('now'); cells[i].classList.add(ok ? 'ok' : 'no');
      if (ok) { right++; streak++; gain = PTS_RIGHT + Math.min(PTS_STREAK_MAX, PTS_STREAK * (streak - 1)); addPoints(gain); }
      else { hits++; streak = 0; take.classList.remove('clipped'); void take.offsetWidth; take.classList.add('clipped'); } }
    hud(); showPts(gain);
    const over = !Q.bonus && (right >= need || hits >= HEARTS);
    fb.classList.remove('gm-right', 'gm-wrong'); void fb.offsetWidth; fb.classList.add(ok ? 'gm-right' : 'gm-wrong');
    fb.replaceChildren(
      h('div', {style: `font-weight:800;font-size:16px;color:var(--${ok ? 'ok' : 'bad'})`, html: Q.bonus ? (ok ? `✓ Remembered. <b>+1 gem, +${PTS_BONUS} ◆</b>` : `✗ No gem this time — it was <b>${Q.a}</b>.`)
        : ok ? `✓ Right. A bar recorded · <b>+${gain} ◆</b>` : `✗ Clipped — the answer is <b>${Q.a}</b>.${hits < HEARTS ? ` ${HEARTS - hits} headroom left.` : ''}`}),
      Q.why ? h('div', {class: 'lede', style: 'font-size:14px;margin:6px auto 0;max-width:58ch', html: glossify(Q.why)}) : '',
      h('button', {class: 'btn acc', style: 'margin-top:12px', on: {click: () => next(Q, over)}}, Q.bonus || over ? 'See result' : 'Next')); }
  function next(Q, over) {
    $('#page') && ($('#page').scrollTop = 0);
    if (Q.bonus) return finish(true);
    if (over) { if (right >= need && bonusQ) { inBonus = true; return render(); } return finish(right >= need); }
    i++; if (i >= qs.length) return finish(right >= need); render(); }
  function finish(won) {
    const best = store.get('course.best', {}); best[id] = Math.max(best[id] || 0, right); store.set('course.best', best);
    let bonus = 0;
    if (won) { if (ch.challenge) MODULES[ch.mod].lessons.filter(l => !l.exam).forEach(l => courseClear(chapKey(l))); else courseClear(id);
      bonus = PTS_WIN + (hits ? 0 : PTS_FLAWLESS) + (ch.challenge ? PTS_TESTOUT : 0); addPoints(bonus); }
    Music.fx(won ? 'win' : 'lose'); ar.beaten(won);
    finished = true; showPts(bonus);
    counter.textContent = ''; hintRow.replaceChildren(); fig.replaceChildren(); take.classList.toggle('kept', won);
    qh.textContent = won ? (hits ? 'Take kept.' : 'Clean take — no clipping.') : 'The take clipped out.'; opts.replaceChildren();
    fb.replaceChildren(h('div', {style: 'font-size:18px', html: won
        ? `${right} bars recorded${hits ? `, ${hits} clip` : ''}. <b>+${bonus} ◆</b> — ${ch.challenge ? `all of ${MODULES[ch.mod].name} is cleared, and everything it unlocks` : 'the next slot is ready'}.`
        : `${right} bar${right === 1 ? '' : 's'} recorded before the second clip. Read the explanations and record another take.`}),
      h('div', {style: 'margin-top:16px;display:flex;gap:12px;justify-content:center'},
        h('button', {class: 'btn', on: {click: again}}, 'Another take'),
        h('button', {class: 'btn acc', on: {click: back}}, 'Back to the Session'))); }
  render();
}

/* the course map is a Session View: each module a track (column) with a coloured header, each lesson a clip slot.
   A cleared lesson is a clip in the track's colour; the next one flashes green like a queued clip; the rest are empty
   slots with the little stop square. The Final Challenge is the last scene, launched from the Main column. */
function roadView(v) {
  pageScroll = true;
  const cleared = courseGot();
  const foIdx = LESSONS.findIndex(l => !cleared[chapKey(l)]), firstOpen = foIdx < 0 ? LESSONS.length - 1 : foIdx;
  const done = LESSONS.filter(l => cleared[chapKey(l)]).length;
  const gems = store.get('course.gems', 0);
  v.append(h('div', {class: 'sv-top'},
    h('div', {class: 'sv-meter'}, h('i', {style: `width:${done / LESSONS.length * 100}%`})),
    h('div', {class: 'muted', style: 'font-weight:800;white-space:nowrap'}, `${done} / ${LESSONS.length} clips` + (gems ? ` · ◆ ${gems}` : ''))));
  const open = l => { const s = state('course', {}); s.open = LESSONS.indexOf(l); keep('course', s); redraw(); };   // l is always a LESSONS entry
  const slot = l => {
    const idx = LESSONS.indexOf(l), st = cleared[chapKey(l)] ? 'done' : (idx <= firstOpen ? 'open' : 'lock');
    return h('button', {class: 'sv-slot ' + st, style: `--c:${l.acc}`, disabled: st === 'lock', 'aria-label': l.name + (st === 'done' ? ', cleared' : st === 'lock' ? ', locked' : ''),
      on: st === 'lock' ? {} : {click: () => open(l)}},
      h('span', {class: 'sv-ic', 'aria-hidden': 'true'}), h('span', {class: 'sv-nm'}, l.name));
  };
  const rows = Math.max(...MODULES.map((m, mi) => LESSONS.filter(l => l.mod === mi && !l.exam).length));
  const grid = h('div', {class: 'sv-grid', style: `--cols:${MODULES.length}`});
  MODULES.forEach((m, mi) => {
    const ls = LESSONS.filter(l => l.mod === mi && !l.exam), got = ls.filter(l => cleared[chapKey(l)]).length;
    const col = h('div', {class: 'sv-col'},
      h('div', {class: 'sv-head', style: `--c:${m.acc}`}, h('b', {}, `${mi + 1} ${m.name}`), h('span', {}, `${got}/${ls.length}`)),
      got < ls.length ? h('button', {class: 'sv-test', title: `One long take over all of ${m.name}. Keep it and the whole module is cleared.`,
        on: {click: () => { const s = state('course', {}); s.challenge = mi; s.open = -1; keep('course', s); redraw(); }}}, 'Test out') : h('div', {class: 'sv-test done'}, 'Cleared'));
    ls.forEach(l => col.append(slot(l)));
    for (let k = ls.length; k < rows; k++) col.append(h('div', {class: 'sv-slot empty', 'aria-hidden': 'true'}, h('span', {class: 'sv-ic'})));
    grid.append(col);
  });
  const exam = LESSONS.find(l => l.exam);
  v.append(h('div', {class: 'sv'}, grid,
    exam ? h('div', {class: 'sv-scene'}, h('div', {class: 'label'}, 'Main · the last scene'), slot(exam)) : ''));
  setTimeout(() => { const pg = $('#page'), cur = v.querySelector('.sv-slot.open'); if (pg && cur && pg.classList.contains('scrollable')) { const r = cur.getBoundingClientRect(), pr = pg.getBoundingClientRect(); if (r.bottom > pr.bottom - 90) pg.scrollTop += (r.top - pr.top) - pr.height * 0.4; } }, 60);
}

PAGES.push({id: 'learn', no: '1', name: 'Learn', blurb: 'a path through Push 3 and Live', acc: 'var(--sage)', draw(v) {
  pageScroll = false;

/* ================================================================ the Push book: sound, the pad grid, the control diagram, the pages
   Nothing musical is typed here: scales, the kit, the beats, the controls and the workflows come from D (export_push.py). */
const KEYS = D.keys, SCALE_BY = Object.fromEntries(D.scales.map(s => [s.id, s])), KIT_BY = Object.fromEntries(D.kit.map(k => [k.id, k]));
const CTL = Object.fromEntries(D.controls.map(c => [c.id, c]));
const noteName = m => SH[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 2);   // Live: middle C (60) is C3
const rootOf = k => pcof(k);
// the 64 Notes layout, the same rule as export_push.pad_midi (asserted there)
function padMidi(col, row, {root = 0, steps = SCALE_BY.major.steps, layout = '4ths', inkey = true, oct = 0} = {}) {
  const base = 36 + root + 12 * oct;
  if (inkey) { const i = col + row * D.rowInKey[layout], n = steps.length; return base + 12 * Math.floor(i / n) + steps[i % n]; }
  return base + col + row * D.rowChrom[layout];
}
console.assert(noteName(padMidi(0, 0)) === 'C1' && padMidi(0, 1) - padMidi(0, 0) === 5, 'bottom-left C1, a fourth per row');

/* ---------------------------------------------------------------- sound: a small two-saw synth and a synthesized kit.
   Every voice goes to A.out unless OUT_OVERRIDE names another bus (the scenes' loop and SFX buses in scene.js set it
   around their scheduling calls). */
let OUT_OVERRIDE = null;
const outBus = () => OUT_OVERRIDE || A.out;
function synthVoice(midi, t, {gain = .14, cutoff = 2600, attack = .006, release = .25} = {}) {
  const ctx = A.ctx, f = 440 * Math.pow(2, (midi - 69) / 12), g = ctx.createGain(), lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = 2.5; lp.frequency.setValueAtTime(cutoff * 1.8, t); lp.frequency.exponentialRampToValueAtTime(Math.max(300, cutoff * .55), t + .5);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.setTargetAtTime(gain * .6, t + attack, .25);
  const os = [-6, 6].map(dt => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt; o.connect(lp); o.start(t); return o; });
  const sub = ctx.createOscillator(); sub.type = 'sine'; sub.frequency.value = f / 2; const sg = ctx.createGain(); sg.gain.value = .5; sub.connect(sg); sg.connect(g); sub.start(t);
  lp.connect(g); g.connect(outBus());
  return {stop(at = A.ctx.currentTime) { g.gain.cancelScheduledValues(at); g.gain.setValueAtTime(g.gain.value, at); g.gain.setTargetAtTime(0, at, release / 4);
    [...os, sub].forEach(o => o.stop(at + release * 1.5)); }};
}
const synthNote = (midi, t, {dur = .4, ...o} = {}) => synthVoice(midi, t, o).stop(t + dur);
const noise = (len) => { const ctx = A.ctx, n = Math.floor(ctx.sampleRate * len), b = ctx.createBuffer(1, n, ctx.sampleRate), y = b.getChannelData(0); for (let i = 0; i < n; i++) y[i] = Math.random() * 2 - 1; return b; };
let _noise = null;
function hit(t, {freq = 2000, type = 'highpass', q = .7, len = .08, gain = .3, decay = .04}) {
  const ctx = A.ctx; if (!_noise) _noise = noise(1.2);
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = _noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(gain, t); g.gain.setTargetAtTime(0, t + .002, decay);
  s.connect(f); f.connect(g); g.connect(outBus()); s.start(t, Math.random() * .5); s.stop(t + len + decay * 6);
}
function boom(t, {f0 = 150, f1 = 45, len = .4, gain = .9, sweep = .05, type = 'sine'}) {
  const ctx = A.ctx, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + sweep);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
  o.connect(g); g.connect(outBus()); o.start(t); o.stop(t + len + .02);
}
const DRUM = {
  kick: (t, v) => boom(t, {gain: .95 * v}),
  rim: (t, v) => { boom(t, {f0: 1700, f1: 1500, len: .03, gain: .3 * v, type: 'square'}); hit(t, {freq: 3000, type: 'bandpass', gain: .2 * v, decay: .01}); },
  snare: (t, v) => { boom(t, {f0: 240, f1: 180, len: .12, gain: .35 * v, sweep: .03, type: 'triangle'}); hit(t, {freq: 1800, gain: .42 * v, decay: .05, len: .2}); },
  clap: (t, v) => [0, .011, .023].forEach((d, i) => hit(t + d, {freq: 1300, type: 'bandpass', q: 1.2, gain: (i === 2 ? .5 : .32) * v, decay: i === 2 ? .07 : .008, len: .2})),
  snare2: (t, v) => { boom(t, {f0: 300, f1: 220, len: .08, gain: .3 * v, type: 'triangle'}); hit(t, {freq: 3200, gain: .36 * v, decay: .035}); },
  chh: (t, v) => hit(t, {freq: 7600, gain: .2 * v, decay: .018}),
  phh: (t, v) => hit(t, {freq: 7000, gain: .14 * v, decay: .012}),
  ohh: (t, v) => hit(t, {freq: 7200, gain: .18 * v, decay: .16, len: .45}),
  crash: (t, v) => hit(t, {freq: 5200, gain: .2 * v, decay: .5, len: 1.4}),
  ride: (t, v) => { hit(t, {freq: 6400, type: 'bandpass', q: 2, gain: .16 * v, decay: .3, len: .9}); boom(t, {f0: 3300, f1: 3200, len: .5, gain: .05 * v}); },
};
['tomlo', 'tomlo2', 'tommid', 'tommid2', 'tomhi', 'tomhi2'].forEach((id, i) => DRUM[id] = (t, v) => boom(t, {f0: [130, 110, 170, 150, 220, 200][i], f1: [85, 70, 110, 100, 150, 135][i], len: .35, gain: .6 * v, sweep: .12}));
const playDrum = (id, t, v = 1) => (DRUM[id] || DRUM.chh)(t, v);
const hearDrum = id => { audio(); playDrum(id, A.ctx.currentTime + .01); };
const hearNotes = (ms, gap = 0, dur = .7) => { audio(); const t = A.ctx.currentTime + .02; ms.forEach((m, i) => synthNote(m, t + i * gap, {dur})); };

/* ---------------------------------------------------------------- the Push 3 control diagram (a schematic grouped by job; the manual

const PUSH_LEFT = [['taptempo', 'metronome'], ['undo', 'save'], ['delete', 'duplicate'], ['quantize', 'doubleloop'], ['convert', 'fixedlength'],

  [['note', 'sessionpad'], 344], [['scale', 'layout'], 488], [['repeat', 'accent'], 528], [['octdown', 'octup'], 568], [['pageleft', 'pageright'], 608], [['shift', 'select'], 648]];
const SHORT = {taptempo: 'Tap', metronome: 'Metro', doubleloop: 'Dbl Loop', fixedlength: 'Fixed Len', stopclip: 'Stop Clip', main: 'Main', sessionscreen: 'Session',
  sessionpad: 'Session', octdown: 'Oct −', octup: 'Oct +', pageleft: 'Page ◂', pageright: 'Page ▸', duplicate: 'Duplicate'};
function pushSVG({lit = [], sel = null, pads = null} = {}) {

  const knob = (id, cx, cy, r, label) => o.push(`<g class="${cls(id)} knob" data-k="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/><line x1="${cx}" y1="${cy - r + 5}" x2="${cx}" y2="${cy - r / 3}"/>${label ? `<text x="${cx}" y="${cy + r + 14}" text-anchor="middle">${label}</text>` : ''}</g>`);
  o.push(`<rect class="body" x="4" y="4" width="992" height="712" rx="26"/>`);
  knob('volume', 55, 52, 24, 'Volume'); knob('tempo', 135, 52, 24, 'Swing/Tempo');
  PUSH_LEFT.forEach(([a, b], k) => { const y = 112 + k * 60; btn(a, 22, y); btn(b, 96, y); });
