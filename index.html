<style>

/* Layout: the printed book, one page per screen on an 11-inch iPad held sideways (1194 x 834).
   Each page keeps the book's header, woven band and line-only sections; the density moves behind the
   dropdowns in the page's toolbar. A practice bar sits at the foot of every page. */
:root{   /* Live Dark — the default: charcoal panels, grey text, Live's orange for what is selected */
  --bg:#1e1e1e; --panel:#2b2b2b; --panel2:#363636; --ink:#dadada; --ink2:#b4b4b4; --mute:#8b8b8b; --rule:#3d3d3d;
  --rust:#ff9b3d; --gold:#f2d24a; --wire:#4a4a4a; --str:#b4b4b4; --onacc:#151515; --dark:#111; --ondark:#dadada;
  --p1:#ff9b3d; --p2:#f2d24a; --p3:#5fd36a; --p4:#3fc6d6; --p5:#a782f2;
  --teal:#3fc6d6; --sage:#5fd36a; --plum:#a782f2; --navy:#5f8ff2; --pink:#f2789b;
  --ok:#5fd36a; --warn:#f2d24a; --bad:#ff5a4e; --acc:var(--rust);
  --pad:#2f2f2f; --padlit:#e9e9e9; --play:#5fd36a; --rec:#ff5a4e;
  --display:'Jost','Futura','Avenir Next','Century Gothic',sans-serif;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --title:'Jost','Futura',sans-serif;
  --barh:66px; color-scheme:dark;
}
/* Live Light — Live's light theme: pale grey panels, dark text, a deeper orange */
:root[data-theme="light"]{
  --bg:#d4d4d4; --panel:#c4c4c4; --panel2:#b8b8b8; --ink:#181818; --ink2:#333; --mute:#5e5e5e; --rule:#acacac;
  --rust:#e0690f; --gold:#b48a00; --wire:#9a9a9a; --str:#333; --onacc:#fff; --dark:#2a2a2a; --ondark:#eee;
  --p1:#e0690f; --p2:#b48a00; --p3:#2f9a3d; --p4:#16879a; --p5:#7451c9;
  --teal:#16879a; --sage:#2f9a3d; --plum:#7451c9; --navy:#3462c9; --pink:#c4436b;
  --ok:#2f9a3d; --warn:#b48a00; --bad:#d23a2f; --acc:var(--rust);
  --pad:#a9a9a9; --padlit:#ffffff; --play:#2f9a3d; --rec:#d23a2f; color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,select,a{touch-action:manipulation}
svg text{font-family:var(--body)}
.book{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;min-height:0;overflow:hidden;position:relative}   /* the frame: clips the content, never lays it out */
.page.scrollable{overflow-y:auto}
/* the content wrapper holds everything at its natural height so it overflows (and fit() can scale it) instead of compressing into overlap */
.pg{display:flex;flex-direction:column;gap:10px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:turn .3s cubic-bezier(.32,.72,0,1)}
.pg.back{animation:turnback .3s cubic-bezier(.32,.72,0,1)}
@keyframes turn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes turnback{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pg{animation:none} *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* the book header */
.hd{display:flex;align-items:flex-end;gap:10px 18px;flex-wrap:nowrap}
.hd .no{font-family:var(--display);font-size:46px;line-height:.85;color:var(--acc);letter-spacing:.06em}
.hd h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.6vw,40px);line-height:.9;letter-spacing:.1em;text-transform:uppercase;margin:0;white-space:nowrap}
.hd h1 em{font-style:normal;color:var(--acc)}
.hd .sub{color:var(--ink2);font-size:15px;font-weight:500;flex:1 1 auto;min-width:0;padding-bottom:1px}
.hd .book-t{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);text-align:right;line-height:1.2;padding-bottom:1px}
.band{color:var(--ink);height:20px;display:block;width:100%;flex:none}
/* the page toolbar: this is where the book's density went */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;flex:none}
.pick{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick>span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
select{border:1.5px solid var(--ink);background:var(--bg);border-radius:9px;padding:8px 34px 8px 12px;font-weight:800;font-size:16px;min-height:44px;max-width:100%;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:7px 10px;font-weight:800;font-size:15px;min-width:44px;min-height:44px;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:9px;padding:8px 14px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.35;cursor:default}
.play::before{content:"";width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none}
.play.on::before{width:10px;height:12px;border:0;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor;box-sizing:border-box}
:is(.btn,.chip,.seg button,select,.cbox,.thumb,.toc button,.arrow,.rt li,.go,.icon,.tempo2 button,.rate button,.goalchip):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* sections: line-only, coloured top rule, Tenor heading with a stepped diamond */
.body{flex:1;min-height:0;display:grid;gap:14px 22px}
.sec{border-top:2.5px solid var(--c,var(--ink));padding-top:7px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.sec>h2{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.09em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--ink)}
.sec>h2 small{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink2);font-weight:600}
.sec.dark{background:var(--dark);color:var(--ondark);border-top:0;padding:10px 14px;border-radius:2px}
.gem{width:13px;height:13px;flex:none}
.lede{color:var(--ink2);margin:0;max-width:70ch;font-size:15px}
.muted{color:var(--mute)}
.fill{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
/* diagrams */
.cgrid{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px 10px;align-items:end}
.cbox{border:0;background:transparent;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;min-width:0;width:100%}
.cbox .nm{font-weight:900;font-size:21px;line-height:1.05}
.cbox .sub{font-size:12.5px;color:var(--mute);font-weight:600;min-height:1.1em;text-align:center;line-height:1.15}
.cbox svg{width:100%;max-width:var(--cw,170px);height:auto}
.cbox.on{background:var(--panel)}
.cbox.dim{opacity:.3}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.thumb{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:4px 4px 2px;display:flex;flex-direction:column;align-items:center;min-width:0}
.thumb b{font-size:13px}
.thumb svg{width:100%;height:auto}
.thumb[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.big{display:flex;justify-content:center}.big svg{width:auto;max-width:100%;height:auto;max-height:430px}
/* tables */
table.t{width:100%;border-collapse:collapse}
table.t td,table.t th{padding:6px 8px 6px 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:baseline}
table.t th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
table.t td.l{font-weight:900;color:var(--c,var(--ink));white-space:nowrap;padding-right:14px}
table.cells{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;text-align:center}
table.cells td,table.cells th{padding:6px 0;border-radius:5px;font-weight:800;font-size:16px}
table.cells th{font-size:12px;color:var(--mute);font-weight:700}
table.cells td{background:var(--panel);font-variant-numeric:tabular-nums}
table.cells td.k{background:none;color:var(--c,var(--ink));font-weight:900;text-align:left;padding-left:2px}
table.cells td.h{background:var(--c,var(--ink));color:var(--onacc)}
table.cells td button{all:unset;cursor:pointer;display:block;width:100%}
/* strum grid */
.sgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px;max-width:960px;width:100%}
.sgrid .ct{text-align:center;font-weight:800;font-size:17px;color:var(--mute)}
.sgrid .ct.b{color:var(--ink);font-size:21px}
.sgrid .st{aspect-ratio:1/1.35;background:var(--panel);border-radius:8px;display:grid;place-items:center;font-size:clamp(26px,4vw,46px);font-weight:900;color:var(--acc);transition:background .08s}
.sgrid .st.now{background:var(--gold);color:var(--onacc)}
.sgrid .st.acc{color:var(--bad)}
.sgrid .st.mute,.sgrid .st.bass{color:var(--ink)}
.sgrid .st.bass span{width:1.2em;height:1.2em;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.6em}
/* contents */
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
.toc button{all:unset;cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1.5px solid var(--rule)}
.toc b{font-family:var(--display);font-weight:400;font-size:24px;text-align:right}
.toc span{font-weight:800;font-size:18px}
.toc small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
/* practice routine list */
.rt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rt-grid{display:grid;grid-auto-flow:column;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);column-gap:30px}   /* Today routine: 3 blocks down the left, 3 down the right */
.rt li{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:baseline;padding:9px 6px;border-bottom:1px solid var(--rule);cursor:pointer;border-radius:6px}
.rt li b{font-family:var(--display);font-size:22px;font-weight:400;color:var(--rust);text-align:right}
.rt li span{font-weight:800}
.rt li i{font-style:normal;font-size:12px;color:var(--mute);font-weight:700}
.rt li[aria-selected="true"]{background:var(--panel)}
.rt li.done span::after{content:" ✓";color:var(--ok)}
.counter{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.rate{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rate button{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;min-height:36px}
.rate button[aria-pressed="true"].clean{background:var(--ok);border-color:var(--ok);color:var(--onacc)}
.rate button[aria-pressed="true"].shaky{background:var(--warn);border-color:var(--warn);color:var(--onacc)}
.rate button[aria-pressed="true"].missed{background:var(--bad);border-color:var(--bad);color:var(--onacc)}
/* the practice bar, on every page */
.pbar{flex:none;z-index:10;min-height:calc(var(--barh) + env(safe-area-inset-bottom,0px));flex-wrap:wrap;row-gap:6px;padding:0 max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  border-top:1.5px solid var(--rule);display:flex;align-items:center;gap:10px;background:var(--bg)}
.pbar .grp{display:flex;align-items:center;gap:6px}
.pbar .bpm{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;min-width:2.4ch;text-align:center;line-height:1}
.pbar .lbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1}
.pbar .beats{display:flex;gap:4px}
.pbar .beats i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.pbar .beats i.on{background:var(--rust)} .pbar .beats i.on.one{background:var(--gold)}
.pbar .sp{flex:1}
.pbar .pg{font-family:var(--display);font-size:15px;letter-spacing:.1em;color:var(--mute);min-width:5ch;text-align:center}
.pbar .clock{font-variant-numeric:tabular-nums;font-weight:800;min-width:3.4ch}
.arrow{border:1.5px solid var(--rule);background:transparent;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font-size:20px;font-weight:900}
.pbar .focus{font-weight:700;font-size:13px;color:var(--ink2);max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.pbar .focus,.pbar .hide-s{display:none}}
@media (max-width:980px){
  .body{grid-template-columns:minmax(0,1fr)!important}
  .hd{flex-wrap:wrap}.hd .sub{flex-basis:100%;order:3}.hd>div:nth-child(4),.hd .book-t{display:none}
  .hd h1{white-space:normal}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))!important}
  .toc{grid-template-columns:minmax(0,1fr)}
  .body.pr>:first-child{order:2}
}
@media (max-width:600px){.pbar{flex-wrap:nowrap;gap:6px}.pbar .pg,.pbar .sp{display:none}.pbar .grp{gap:4px}.thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}.hd .no{font-size:36px}.pbar .bpm{font-size:22px}.arrow{width:40px;height:40px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--barh) + 12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
textarea{width:100%;min-height:80px;border:1.5px solid var(--rule);border-radius:10px;padding:10px;background:transparent;box-sizing:border-box}
/* sketchpad pieces reused from the studio */
.timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.bar{border:1.5px solid var(--rule);border-radius:10px;padding:6px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:66px;justify-content:center}
.bar .rn{font-size:12px;font-weight:800;color:var(--mute)} .bar .cn{font-size:20px;font-weight:900}
.bar[aria-pressed="true"]{border-color:var(--rust);box-shadow:inset 0 0 0 1.5px var(--rust)}
.bar.now{background:var(--rust);border-color:var(--rust);color:var(--onacc)} .bar.now .rn{color:var(--onacc)}
.bar.empty{border-style:dashed;color:var(--mute);font-weight:700;font-size:13px}
.pal{display:flex;flex-wrap:wrap;gap:5px}
.pal button{border:1.5px solid var(--rule);background:transparent;border-radius:9px;padding:4px 8px;min-width:54px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pal button i{font-style:normal;font-size:11px;font-weight:800;color:var(--mute)} .pal button b{font-size:16px;font-weight:900}
.pal button.home{border-color:var(--gold)} .pal button.color b{color:var(--rust)}
.sections{display:flex;flex-wrap:wrap;gap:6px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));grid-auto-rows:max-content;align-content:start;gap:2px 16px;max-height:260px;overflow:auto;border:1.5px solid var(--rule);border-radius:10px;padding:6px 10px}
.lib h4{grid-column:1/-1;margin:6px 0 0;font-family:var(--display);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--rust)}
.lib button{border:0;background:transparent;text-align:left;padding:5px 4px;border-radius:6px;display:flex;flex-direction:column}
.lib button b{font-weight:900;font-size:14px} .lib button span{font-size:13px;color:var(--ink2)} .lib button em{font-size:12px;color:var(--mute)}
.form{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.form span{border-radius:6px;padding:4px 8px;font-weight:800;font-size:13px;color:var(--onacc)}
.songs{display:flex;flex-wrap:wrap;gap:6px}
.tl{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px}
.tl span{display:grid;place-items:center;color:var(--onacc);font-weight:800;font-size:13px;min-width:0;overflow:hidden}

/* ===== polish pass ===== */
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile2{border-top:2.5px solid var(--navy);background:var(--panel);border-radius:0 0 10px 10px;padding:8px 16px 10px;min-width:74px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile2 span{font-size:13px;font-weight:800;color:var(--navy);letter-spacing:.04em}
.tile2 b{font-size:30px;font-weight:900;line-height:1}
.pg{gap:14px}
.hd2{display:flex;flex-direction:column;gap:6px}
.hd2 .band{height:20px;opacity:1}   /* full band on every page, matching the cover */
.hrow{display:flex;align-items:flex-end;gap:14px;min-width:0}
.hrow .no{font-family:var(--display);font-size:44px;line-height:.82;color:var(--acc);letter-spacing:.04em;flex:none}
.hrow h1{flex:1;min-width:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:.92;letter-spacing:.1em;text-transform:uppercase;margin:0;white-space:nowrap}
.hrow h1 em{font-style:normal;color:var(--acc)}
.run{font-family:var(--display);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);white-space:nowrap;padding-bottom:3px}
.run b{font-weight:400;color:var(--acc)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 28px;font-size:14px;line-height:1.4}
.meta .sub{color:var(--ink2);font-weight:600}
.meta .key{color:var(--mute)} .meta .key b{color:var(--ink2)}
/* fields: underline style, quieter than boxes, matching the line-only sections */
select{border:0;border-bottom:2px solid var(--ink);border-radius:0;background-color:transparent;padding:7px 30px 6px 1px;font-size:17px;min-height:44px}
select:hover{border-bottom-color:var(--acc)}
.pick>span{font-size:10.5px;letter-spacing:.16em}
.toolbar{gap:12px 30px;padding-bottom:2px}
.seg{border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px}
.seg button{border-radius:999px;padding:5px 14px;min-height:36px}
.chip{border-radius:10px;border-color:var(--ink)}
.btn{border-radius:999px}
.sec{gap:10px}
.sec>h2{font-size:18px}
.sec>h2 small{font-size:13.5px;color:var(--mute)}
.cbox{transition:background .15s ease-out,transform .14s cubic-bezier(.2,0,.2,1)}
.cbox:hover{background:var(--panel)}
.cbox .nm{font-size:20px;letter-spacing:.01em}
.thumb{border-radius:12px;padding:6px 6px 4px;gap:2px}
.thumb b{font-size:12.5px;letter-spacing:.02em}
.rt li{padding:10px 8px;border-radius:8px}
.rt li[aria-selected="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--rust)}
table.t td.l{font-weight:800}
.lede{line-height:1.5}
/* the practice bar */
.pbar{gap:12px;padding-top:9px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));min-height:0;flex-wrap:nowrap}
.footband{flex:none;width:100%;line-height:0}   /* the Southwestern band above the nav, where the thin rule used to be */
.tempo2{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:999px;height:46px;padding:0 3px;gap:0;flex:none}
.tempo2 button{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-size:22px;font-weight:600;display:grid;place-items:center;color:var(--ink)}
.tempo2 button:active{background:var(--panel)}
.tempo2 .v{display:flex;flex-direction:column;align-items:center;min-width:50px;line-height:1;gap:2px}
.tempo2 .bpm{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;min-width:0}
.tempo2 .v span{font-size:10.5px;letter-spacing:.16em;color:var(--mute);font-weight:800}
.icon{border:1.5px solid var(--ink);background:transparent;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink);padding:0}
.icon svg{width:22px;height:22px}
.icon.on{background:var(--ink);color:var(--bg)}
.icon.tap{font-size:11px;font-weight:900;letter-spacing:.08em;border-color:var(--rule)}
.cta{display:flex;align-items:center;gap:12px;min-width:0}
.cta .go{background:var(--acc);color:var(--onacc);border:0;border-radius:999px;height:50px;padding:0 22px 0 18px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:10px;flex:none}
.what{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.what>span:first-child{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:800}
.what>span:last-child{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
.cta.none .what>span:last-child{color:var(--mute);font-weight:600}
.clock2{display:flex;align-items:center;gap:9px}
.clock2 .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px}
.clock2 .lbl{font-size:10px}
.station{display:flex;align-items:center;gap:8px;flex:none}
.station .dots{display:flex;gap:4px;margin-left:2px}
/* contextual "Numbers to beat" on the Practice page */
.goals-ctx{display:flex;flex-direction:column;gap:8px}
.goal-tiers{display:flex;gap:6px}
.goalchip{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;min-width:0;line-height:1.1}
.goalchip span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
.goalchip b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.goalchip.on{background:var(--gold);color:var(--onacc);border-color:var(--gold)}
.goalchip.on span{color:var(--onacc)}
.youline{font-size:13px;font-weight:700}
.pgnum{font-family:var(--display);letter-spacing:.1em;color:var(--mute);font-size:13px;white-space:nowrap;text-transform:uppercase;max-width:20ch;overflow:hidden;text-overflow:ellipsis}
.arrow{width:46px;height:46px;border:1.5px solid var(--ink);font-size:24px;font-weight:600;flex:none;color:var(--ink)}
@media (max-width:980px){ .run{display:none} .hrow h1{white-space:normal} .pgnum{display:none} }
@media (max-width:600px){ .cta .what{display:none} .cta.none .what{display:flex} .cta .go{padding:0 16px 0 14px;font-size:15px} .tempo2 .v{min-width:40px} }
/* phones, narrow (≤560px): a compact bottom bar and smaller everything so there's less to scroll */
@media (max-width:560px){
  .cta.none .what{display:none}                                  /* was the thing pushing the forward arrow off */
  .pbar .tap{display:none}                                       /* drop tap-tempo on phones; the −/+ remain */
  .pbar{gap:4px} .pbar .go.play{font-size:0;gap:0;padding:0 14px;min-width:42px}   /* play button → just the ▶ */
  .tempo2{height:40px;padding:0 2px} .tempo2 button{width:31px;height:31px;font-size:18px} .tempo2 .v{min-width:34px} .tempo2 .bpm{font-size:18px}
  .icon{width:40px;height:40px} .arrow{width:36px;height:36px}
  .pg{gap:9px;padding-block:9px 13px} .sec{gap:6px} .body{gap:9px 12px}
  .band{height:12px} .hd2 .band{height:8px;opacity:.5} .hd2{gap:4px}
  .hrow h1{font-size:clamp(24px,7.5vw,32px)} .brand-big{font-size:clamp(34px,10vw,48px)!important}
  .sec>h2{font-size:15px} .sec>h2 small{font-size:12px} .lede{font-size:13.5px}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))!important;gap:6px 8px} .cbox .nm{font-size:16px} .cbox .sub{font-size:11px}
  .big svg{max-height:300px} .toolbar{gap:7px 14px} select{min-height:40px;font-size:16px}
}
/* short screens (≤460px tall) = a phone held sideways: reclaim vertical space so content isn't buried */
@media (max-height:460px){
  .band{display:none} .hd2{gap:2px} .hrow h1{font-size:24px} .run{display:none}
  .meta,.hd2 .sub{font-size:12px} .pg{gap:6px;padding-block:5px 9px} .sec{gap:5px} .sec>h2{font-size:15px}
  .toolbar{gap:6px 14px;padding-bottom:0} select{min-height:36px} .seg button{min-height:32px;padding:4px 11px} .btn{min-height:34px}
  .pbar{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
  .pbar .tap,.pbar .clock2,.cta .what,.cta.none .what{display:none}   /* just the essentials in the bar */
  .pbar .go.play{font-size:0;gap:0;padding:0 13px;min-width:40px}
  .tempo2{height:36px;padding:0 2px} .tempo2 button{width:29px;height:29px;font-size:17px} .tempo2 .v{min-width:32px} .tempo2 .bpm{font-size:16px}
  .icon{width:36px;height:36px} .arrow{width:34px;height:34px}
  .big svg{max-height:210px} .cgrid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))!important}
}
/* IX Writing: slim song-shape row under the bars, compact melody table */
.shape-row{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-top:2px}
.shape-row .label{color:var(--rust)}
.shape-row .tl{flex:1;min-width:200px}
.cells.mel-compact{border-spacing:2px;table-layout:auto}
.cells.mel-compact td,.cells.mel-compact th{padding:3px 8px 3px 0;font-size:14px}
.prog-list{display:flex;flex-direction:column}
.prog-item{all:unset;cursor:pointer;display:block;padding:6px 6px;border-bottom:1px solid var(--rule)}
.prog-item.on{background:var(--panel)}
.prog-item:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.pl-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pl-top b{font-weight:900;font-size:15px}
.pl-top span{font-size:14px;color:var(--ink2);font-weight:700}
.pl-desc{font-size:12px;color:var(--mute);line-height:1.3;margin-top:1px}
/* --- motion & press feedback: subtle, fast, purposeful (reviewed for an Apple-like feel) --- */
.btn,.chip,.seg button,.icon,.arrow,.go,.thumb,.cbox,.goalchip,.rate button,.toc button,.rt li,.prog-item,.bar,.tempo2 button{transition:transform .12s cubic-bezier(.2,0,.2,1),background-color .16s ease-out,color .16s ease-out,border-color .16s ease-out,box-shadow .16s ease-out,opacity .12s ease-out}
:is(.btn,.chip,.seg button,.icon,.arrow,.thumb,.goalchip,.rate button,.toc button,.tempo2 button):active{transform:scale(.96)}
.go:active{transform:scale(.975)}
.cbox.on{transform:scale(1.03)}
.play::before{transition:border-width .14s ease-out,width .14s ease-out,height .14s ease-out}
.arrow svg{width:22px;height:22px} .tempo2 button svg{width:20px;height:20px}
.pbar .beats i{transition:transform .09s ease-out,background-color .09s ease-out}
.pbar .beats i.on{transform:scale(1.35)} .pbar .beats i.on.one{transform:scale(1.5)}
.sgrid .st{transition:background .08s ease-out,transform .08s ease-out}
.sgrid .st.now{transform:scale(1.04)}
@keyframes gm-right{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes gm-wrong{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.gm-right{animation:gm-right .3s ease-out} .gm-wrong{animation:gm-wrong .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes sageHop{0%{transform:translateY(0)}30%{transform:translateY(-12px)}55%{transform:translateY(0)}72%{transform:translateY(-5px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Theory Lab: the facts feed and the circle-of-fifths wheel */
.facts{display:flex;flex-direction:column;gap:10px}
.fact{border-left:3px solid var(--navy);background:var(--panel);border-radius:0 10px 10px 0;padding:9px 14px}
.fact h3{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.fact p{margin:0;font-size:14px;line-height:1.45;color:var(--ink2)}
.term{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:var(--rust);cursor:pointer;border-bottom:1.5px dotted currentColor;line-height:1.1}
.term:hover,.term:focus-visible{opacity:.72}
#cpop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;z-index:200;padding:22px}
.cpop-card{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:16px;max-width:430px;width:100%;padding:24px 26px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.cpop-card h3{margin:0 0 10px;font-family:var(--title);font-size:25px;letter-spacing:.02em;color:var(--rust)}
.cpop-short{margin:0 0 10px;font-size:16px;line-height:1.5}
.cpop-more{margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--ink2)}
.cpop-see{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-top:1px solid var(--rule);padding-top:12px}
.cpop-see>div{display:flex;flex-wrap:wrap;gap:6px 14px}
.cpop-go{margin-top:16px}
.cpop-x{position:absolute;top:10px;right:14px;appearance:none;border:0;background:none;font-size:26px;line-height:1;color:var(--mute);cursor:pointer}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:8px}
.gloss-row{text-align:left;appearance:none;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:9px 13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit}
.gloss-row:hover{border-color:var(--rust)}
.gloss-row b{font-size:15px;color:var(--rust)}
.gloss-row span{font-size:12.5px;color:var(--ink2);line-height:1.35}
.btn.match{width:100%;text-align:left;min-height:46px}
.btn.match.sel{outline:2.5px solid var(--gold);outline-offset:1px}
.btn.match.matched{background:var(--sage);color:var(--onacc);border-color:var(--sage)}
.wheel{position:relative;width:300px;height:300px;margin:4px auto;max-width:100%}
.wheel .ring{position:absolute;inset:14px;border-radius:50%;border:1.5px dashed var(--rule)}

/* ===== applified: one top bar, the instrument as the page, explanations in the Index ===== */
/* the top bar: numeral, title, and the page's controls on one line */
.pg{gap:18px}
.hd2{gap:0}
.hd2 .hrow{align-items:center;flex-wrap:wrap;gap:10px 20px;min-height:50px}
.hrow .no{font-size:30px;line-height:1}
.hrow h1{flex:0 1 auto;font-size:clamp(24px,2.6vw,31px);letter-spacing:.08em;line-height:1}
.hrow .toolbar{margin-left:auto;align-items:center;gap:8px 10px;padding:0}
.pick>span{display:none}
select{min-height:44px;border-radius:999px;padding:0 34px 0 16px;border:1.5px solid var(--ink);background-color:transparent;font-weight:800}
/* sections: a quiet sentence-case title, no rule */
.sec{border-top:0;padding-top:0;gap:12px}
.sec>h2{font-size:21px;letter-spacing:.02em;text-transform:none}
.body{gap:22px 30px}
.body.split{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}
.stage{display:flex;flex-direction:column;gap:18px;min-width:0}
.cbox .sub{font-weight:800;color:var(--mute)}
.neckwrap{border:0;background:var(--panel);border-radius:18px;padding:10px 8px}
.tuner-stage{max-width:520px;width:100%;margin:0 auto}
.icon.sound{font-size:20px;border-color:var(--rule)}
/* home: the mark and the tuner, one big way back in, the six chapters */
.home{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.home-brand{display:flex;align-items:center;gap:18px}
.home-mark{all:unset;cursor:pointer;width:92px;flex:none;display:block}
.home h1{font-family:var(--title);font-weight:400;font-size:clamp(42px,5.6vw,68px);letter-spacing:.06em;line-height:.92;text-transform:uppercase;margin:0}
.home-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.1fr);gap:14px;flex:1;min-height:0}
.home-go{all:unset;cursor:pointer;box-sizing:border-box;background:var(--rust);color:var(--onacc);border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:200px}
.home-go b{font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:.04em;line-height:1}
.home-go span{font-weight:700;font-size:16px;opacity:.88}
.home-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.home-tiles button{all:unset;cursor:pointer;box-sizing:border-box;border-radius:22px;background:var(--panel);padding:16px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:112px}
.home-tiles b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;color:var(--c)}
.home-tiles span{font-weight:800;font-size:19px}
:is(.home-go,.home-tiles button,.keyring button):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
:is(.home-go,.home-tiles button):active{transform:scale(.98)}
/* Chords · Keys: the circle of fifths as the key picker */
.keyring{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.keyring button{all:unset;cursor:pointer;text-align:center;border-radius:14px;padding:10px 0;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.keyring b{font-size:22px;font-weight:900}
.keyring small{font-size:12px;font-weight:700;color:var(--mute)}
.keyring button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.keyring button[aria-pressed="true"] small{color:inherit;opacity:.7}
/* Chords · Chop grips: where the roots sit */
table.cells.roots{min-width:760px}
table.cells.roots td{color:var(--mute);font-weight:600;font-size:14px}
table.cells.roots td.k{color:var(--ink);font-weight:900}
table.cells.roots td.rt{color:var(--c);font-weight:900}
table.cells.roots td.lit{background:var(--c);color:var(--onacc);font-weight:900}
/* Double Stops: the table is the selector */
table.cells.ds td.sel{box-shadow:inset 0 0 0 3px var(--ink)}
table.cells.ds td small{display:block;font-size:11px;opacity:.75}
@media (max-width:820px){
  .home-body{grid-template-columns:minmax(0,1fr)} .home-go{min-height:120px}
  .home-tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .home-tiles button{min-height:92px}
  .keyring{grid-template-columns:repeat(6,minmax(0,1fr))}
  .body.split{grid-template-columns:minmax(0,1fr)}
  .hrow .toolbar{margin-left:0;width:100%}
}
/* the home screen fills the page: Continue is the tall block, the chapters split the rest */
.home-body{grid-template-rows:repeat(2,minmax(150px,1fr))}
.home-go{grid-row:1 / span 2}
.home-tiles{grid-row:1 / span 2;grid-template-rows:repeat(2,minmax(0,1fr))}
.home-tiles b{font-size:38px}
.home-tiles span{font-size:21px}
/* pick cells: a strip, not tiles */
.stage .sgrid .st{aspect-ratio:auto;height:clamp(84px,17vh,150px)}
@media (max-width:820px){ .home-body{grid-template-rows:none} .home-go,.home-tiles{grid-row:auto} .home-tiles{grid-template-rows:none} }
.home-body{min-height:min(60vh,520px)}
@media (max-width:820px){ .home-body{min-height:0} .stage .sgrid .st{height:64px} }
/* ===== the iPad pass: simple, not empty — each page's drawing grows into the room between the bars ===== */
:root{--room:calc(100dvh - 176px)}
.grid-svg svg{max-height:none}
/* Practice: a lone pick row stands tall; the chord beside it is a hero card */
.stage.tall .sgrid .st{height:clamp(120px,calc(var(--room) - 70px),460px)}
.stage .sgrid .st{font-size:clamp(28px,5vw,64px)}
.stage:not(.tall) .sgrid .st{height:clamp(84px,22vh,190px)}
.stage .grid-svg svg{max-height:calc(var(--room) - 40px)}
.hero-card{justify-items:center}
.hero-card .cbox .nm{font-size:30px}
/* Lab: a roomier neck and one big companion drawing */
.companion{background:var(--panel);border-radius:18px;padding:14px 18px}
.companion svg{max-height:calc(var(--room) - 340px);min-height:180px;margin:0 auto}
.ivgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ivgrid button{all:unset;cursor:pointer;box-sizing:border-box;background:var(--panel);border-radius:16px;padding:16px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;min-height:96px;justify-content:center}
.ivgrid b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--acc)}
.ivgrid span{font-size:13px;font-weight:700;color:var(--mute)}
.ivgrid button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ivgrid button:active{transform:scale(.97)}
.tuner-stage{max-width:720px}
.tuner-stage .needle{max-width:640px}
.tuner-stage .tlights button{min-width:120px;min-height:86px}
.tuner-stage .tlights b{font-size:40px}
/* Double Stops: the table and the pair share the full height */
.ds-body{min-height:var(--room);align-items:stretch}
.ds-body>.neckwrap{display:flex;align-items:stretch;padding:14px}
table.cells.ds{height:100%;width:100%}
table.cells.ds td{font-size:24px}
table.cells.ds td small{font-size:13px}
table.cells.ds td.k{font-size:15px}
.ds-body>.stage{justify-content:center;background:var(--panel);border-radius:18px;padding:18px}
.ds-body .grid-svg svg{max-height:calc(var(--room) - 60px)}
@media (max-width:820px){
  :root{--room:auto}
  .stage.tall .sgrid .st{height:96px} .stage:not(.tall) .sgrid .st{height:64px}
  .ivgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ds-body{min-height:0} .companion svg{max-height:none;min-height:0}
}

/* ===== Liquid-glass pass: glass on the navigation layer only, springs for every motion, touch-down light ===== */
/* the material: tint from the page itself, blur + saturation for the lensing, a specular rim on top, a soft shadow under */
:root{--glass:color-mix(in srgb,var(--bg) 58%,transparent);--rim:rgba(255,255,255,.55);--glass-shadow:0 10px 30px rgba(40,25,10,.12),0 1px 3px rgba(40,25,10,.08)}
.glass,.pbar,.hd2{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8)}

/* the practice bar floats as a capsule over the page; the page scrolls under it */
.footband{display:none}
.pbar{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  min-height:0;padding:8px 10px;border:0;border-radius:32px;box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent),var(--glass-shadow);
  background-image:radial-gradient(140px 56px at var(--sx,50%) 0%,var(--spec),transparent 70%)}
.pg{padding-bottom:calc(var(--barh) + 40px)}
:root{--room:calc(100dvh - 190px)}
.toast{bottom:calc(var(--barh) + 30px + env(safe-area-inset-bottom,0px));border-radius:999px}

/* the top bar sticks as glass; content dissolves under its soft edge, and its shadow deepens once something is under it */
.hd2{position:sticky;top:0;z-index:20;margin:-14px -16px 0;padding:10px 16px;border-radius:0 0 26px 26px;transition:box-shadow var(--sp-snap-ms) var(--sp-snap)}
.hd2::after{content:'';position:absolute;left:0;right:0;top:100%;height:18px;pointer-events:none;background:linear-gradient(var(--glass),transparent);opacity:0;transition:opacity .25s}
.under .hd2{box-shadow:inset 0 -1px 0 var(--rim),var(--glass-shadow)} .under .hd2::after{opacity:1}

/* touch-down: everything you can press sinks a little at once and lights from the touch point outward */
:is(button,.cbox,.chip,select){transition:transform var(--sp-press-ms) var(--sp-press),box-shadow var(--sp-snap-ms) var(--sp-snap),background-color .18s,color .18s}
:is(button,.cbox,.chip,select).pressing{transform:scale(.96)}
:is(.home-tiles button,.home-go).pressing{transform:scale(.975)}
.neckwrap.pressing,.pbar button.pressing{transform:none}
:is(button,.cbox,.chip,.neckwrap){position:relative;isolation:isolate}
:is(button,.cbox,.chip,.neckwrap).glow::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),color-mix(in srgb,white 55%,transparent) 0,transparent 55%);animation:glow .6s ease-out forwards}
@keyframes glow{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.25)}}
.cbox{border-radius:18px}
.cbox.on{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 30px rgba(40,25,10,.16)}

/* morphing thumbs: the selection is a glass pill that slides between options */
.seg.has-thumb,.keyring.has-thumb{position:relative}
.seg .thumb{position:absolute;z-index:0;border-radius:999px;background:var(--ink);box-shadow:inset 0 1px 0 color-mix(in srgb,white 25%,transparent),0 3px 10px rgba(40,25,10,.22);transform-origin:left center;will-change:transform}
.seg.has-thumb button{position:relative;z-index:1}
.seg.has-thumb button[aria-pressed="true"]{background:transparent}
.keyring .thumb{position:absolute;z-index:1;border-radius:14px;background:var(--ink);box-shadow:0 6px 16px rgba(40,25,10,.25);transform-origin:left top;will-change:transform}
.keyring.has-thumb button{z-index:0}
.keyring.has-thumb button[aria-pressed="true"]{background:transparent;z-index:2}
/* glass pills for the menus */
select{background-color:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 var(--rim)}

/* page turns: sharpen out of a blur and slide in on the page spring; grow out of a tapped tile */
.pg{animation:turn var(--sp-page-ms) var(--sp-page) backwards}
.pg.back{animation:turnback var(--sp-page-ms) var(--sp-page) backwards}
.pg.grow{animation:grow var(--sp-page-ms) var(--sp-page) backwards}
@keyframes turn{from{opacity:0;filter:blur(10px);transform:translateX(40px) scale(.985)}to{opacity:1;filter:none;transform:none}}
@keyframes turnback{from{opacity:0;filter:blur(10px);transform:translateX(-40px) scale(.985)}to{opacity:1;filter:none;transform:none}}
@keyframes grow{from{opacity:0;filter:blur(12px);transform:scale(.9)}to{opacity:1;filter:none;transform:none}}
/* the lit pick cell and the lit table cell pop on the press spring */
.sgrid .st{transition:background-color .12s,transform var(--sp-press-ms) var(--sp-morph)}
.sgrid .st.now{transform:scale(1.06);box-shadow:0 8px 22px color-mix(in srgb,var(--gold) 45%,transparent)}
table.cells.ds td{transition:box-shadow var(--sp-snap-ms) var(--sp-snap)}

/* Double Stops fills the room (the split rule is more specific, so match it) */
.body.split.ds-body{min-height:var(--room);align-items:stretch}

/* honour the system settings, as Liquid Glass does */
@media (prefers-reduced-motion:reduce){
  .pg,.pg.back,.pg.grow{animation:none} :is(button,.cbox,.chip,select).pressing{transform:none} .cbox.on,.sgrid .st.now{transform:none}
  :is(button,.cbox,.chip,.neckwrap).glow::after{animation-duration:.001ms}
}
@media (prefers-reduced-transparency:reduce){ .glass,.pbar,.hd2,select{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none} }
@media (prefers-contrast:more){ .pbar,.hd2{box-shadow:inset 0 0 0 2px var(--ink)} .seg .thumb,.keyring .thumb{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)} }
@media (max-width:820px){ .pbar{left:8px;right:8px;border-radius:26px;padding:6px 8px} .hd2{margin:-9px -16px 0;padding:8px 16px} }
.seg .thumb,.keyring .thumb{box-sizing:border-box;padding:0;margin:0;border:0;min-height:0;min-width:0}
/* the specular highlight is a token so the dark glass gets a faint rim, not a smear */
:root{--spec:rgba(255,255,255,.32)}
@media (max-width:820px){ .cgrid.hero-card{grid-template-columns:minmax(0,1fr)!important;justify-items:center} .hero-card .cbox svg{max-width:220px;width:220px} }

/* ===== Widgets pass (after Apple's "Design Great Widgets" and WWDC25's new design system) ===== */
/* each chapter tile is a widget: numeral, a glance at where you left that page, the name. One tap target per tile. */
.home-tiles button{justify-content:flex-start}
.home-tiles .glance{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:4px 0}
.glance .gsvg{height:100%;max-height:150px;display:flex;align-items:center;justify-content:center}
.glance .gsvg svg{height:100%;width:auto;max-width:100%}
.glance .gsvg.wide{width:100%;height:auto} .glance .gsvg.wide svg{width:100%;height:auto;max-height:140px}
.glance .mods{display:flex;gap:6px;width:100%;align-items:flex-end;height:70px}
.glance .mods i{flex:1;height:100%;border-radius:8px;background:linear-gradient(to top,var(--c) calc(var(--p) * 100%),color-mix(in srgb,var(--c) 16%,transparent) 0)}
.glance .picks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.glance .picks i{font-style:normal;font-weight:900;font-size:22px;text-align:center;padding:8px 0;border-radius:12px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.glance .picks i.up{color:var(--rust)} .glance .picks i.chop{background:var(--rust);color:var(--onacc)} .glance .picks i.rest{opacity:.4}
.glance .term-day{font-family:var(--display);font-style:normal;font-size:30px;line-height:1.1;text-align:center;color:var(--ink);text-wrap:balance}
/* Continue carries the course as a ring: done of all, filled on the snap spring when the home screen draws */
.home-go{justify-content:space-between}
.home-go .ring{--p:0;width:clamp(110px,16vw,170px);aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--rust) 82%,transparent 83%),conic-gradient(var(--onacc) calc(var(--p) * 360deg),color-mix(in srgb,var(--onacc) 22%,transparent) 0)}
.home-go .ring span{font-family:var(--display);font-size:clamp(40px,5vw,58px);line-height:1}
.home-go .ring small{font-weight:800;font-size:14px;opacity:.8}
@media (max-width:820px){ .home-go .ring{width:84px} .home-go .ring span{font-size:30px} .home-go{flex-direction:row-reverse;align-items:center;justify-content:space-between} .home-tiles .glance{display:none} }

/* concentric corners: a nested shape's radius is its parent's minus the padding between them */
:root{--r-tile:22px;--r-panel:18px}
.home-tiles button,.home-go{border-radius:var(--r-tile)}
.glance .picks i{border-radius:calc(var(--r-tile) - 14px)}
.companion,.neckwrap,.ds-body>.stage{border-radius:var(--r-panel)}

/* the practice bar steps aside while you read down a page and comes back as soon as you scroll up (tabBarMinimizeBehavior .onScrollDown) */
.pbar{transition:left var(--sp-morph-ms) var(--sp-morph),right var(--sp-morph-ms) var(--sp-morph),padding var(--sp-snap-ms) var(--sp-snap)}
.pbar .station,.pbar .cta .what{max-width:640px;overflow:hidden;transition:max-width var(--sp-morph-ms) var(--sp-morph),opacity var(--sp-snap-ms) var(--sp-snap)}
@media (min-width:821px){
  .mini .pbar{left:calc(50% - 190px);right:calc(50% - 190px);justify-content:space-between}
  .mini .pbar .station,.mini .pbar .cta .what{max-width:0;opacity:0;pointer-events:none}
}
@media (prefers-reduced-motion:reduce){ .pbar,.pbar .station,.pbar .cta .what{transition:none} }
@media (min-width:821px){ .mini .pbar:not(:has(.go)){left:calc(50% - 74px);right:calc(50% - 74px)} }
/* the progress fills in when the home screen draws: a registered number animates where a bare custom property would jump */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
.home-go .ring,.glance .mods i{animation:fill 1.1s var(--sp-morph) backwards}
.glance .mods i:nth-child(n){animation-delay:calc(var(--i,0) * 40ms)}
@keyframes fill{from{--p:0}}
@media (prefers-reduced-motion:reduce){ .home-go .ring,.glance .mods i{animation:none} }
/* the lesson is the content, so it gets the big type; "Continue" is its label */
.home-go .go-t{display:flex;flex-direction:column;gap:8px}
.home-go .go-t b{font-size:clamp(28px,3.4vw,40px);line-height:1.08;text-wrap:balance}
@media (max-width:820px){ .home-go .go-t b{font-size:24px} }

/* ===== the Push book's own look, after Live: charcoal panels, small bold sans labels, orange for the selection,
   green for playing, red for recording; the pads glow like Push's RGB pads. (push_base.css above is the shared
   applified / glass / widget layer lifted from the mandolin book.) */
:root{--glass:color-mix(in srgb,var(--bg) 62%,transparent);--rim:rgba(255,255,255,.10);--glass-shadow:0 12px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);--spec:rgba(255,255,255,.05)}
[data-theme="light"]{--glass:color-mix(in srgb,var(--bg) 60%,transparent);--rim:rgba(255,255,255,.6);--glass-shadow:0 10px 30px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.1);--spec:rgba(255,255,255,.3)}
body{font-size:15px}
/* type: Jost (Futura's family) for headings and numerals, set in sentence case like Ableton's own pages */
.hrow .no{font-family:var(--display);font-weight:600;font-size:30px;color:var(--acc)}
.hrow h1{font-family:var(--display);font-weight:500;letter-spacing:.01em;text-transform:none;font-size:clamp(26px,2.8vw,34px)}
.sec>h2{font-family:var(--display);font-weight:500;letter-spacing:.01em}
.band{height:14px}
.btn,.seg,select,.chip{border-color:var(--rule)}
.btn{border-radius:6px;font-weight:700}
.btn.acc{color:var(--onacc)}
.seg{border-radius:7px;padding:2px}
.seg button{border-radius:5px}
.seg .thumb{border-radius:5px;background:var(--rust)}
.seg button[aria-pressed="true"]{color:var(--onacc)}
select{border-radius:6px;border-color:var(--rule)}
.chip{border-radius:6px}
.cpop-card{border-radius:10px;background:var(--panel)}
.cpop-card h3{font-family:var(--display);font-weight:600;color:var(--rust)}
.term{color:var(--rust)}
.gloss-row{border-radius:6px}
.gloss-row b{color:var(--rust)}
.fact{border-left-color:var(--rust);border-radius:0 6px 6px 0}
.fact h3{font-family:var(--display);font-weight:600;text-transform:none;letter-spacing:.01em;font-size:16px}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lede{font-size:14.5px}

/* home */
.home h1{font-family:var(--title);font-weight:600;text-transform:none;letter-spacing:-.01em;font-size:clamp(46px,6vw,76px);line-height:.95}
.home h1 em{font-style:normal;font-weight:300;color:var(--rust)}
.home-mark{width:96px}
.home-sub{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.home-sub b{font-family:var(--display);font-weight:500;font-size:20px}
.home-sub span{font-size:12px;color:var(--mute);max-width:34ch}
.home-go{background:var(--sage);color:#111}
.home-go .ring{background:radial-gradient(closest-side,var(--sage) 82%,transparent 83%),conic-gradient(#111 calc(var(--p) * 360deg),color-mix(in srgb,#111 18%,transparent) 0)}
.home-go .ring span,.home-go b{font-family:var(--display);font-weight:500}
.home-tiles b{font-family:var(--display);font-weight:600}
.home-tiles button{border-radius:12px;border-top:3px solid var(--c)}
:root{--r-tile:12px;--r-panel:10px}
.glance .gpads{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:100%;max-width:210px}
.glance .gpads i{aspect-ratio:1;border-radius:3px;background:var(--pad)}
.glance .gpads i.in{background:var(--padlit);opacity:.85}
.glance .gpads i.root{background:var(--rust)}
.glance .gwf{display:flex;flex-direction:column;gap:4px;text-align:center}
.glance .gwf b{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.1}
.glance .gwf span{font-size:13px;color:var(--mute);font-weight:700}
.glance .gsvg.wide svg{max-height:130px}

/* the pad grid: dark rubber pads that glow */
.padwrap{background:#111;border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1px #2a2a2a}
[data-theme="light"] .padwrap{background:#2a2a2a}
.padgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;max-width:min(100%,calc(var(--room) - 30px));margin:0 auto;touch-action:none}
.pad{all:unset;position:relative;isolation:isolate;overflow:hidden;box-sizing:border-box;aspect-ratio:1;border-radius:7px;background:#262626;display:grid;place-items:center;cursor:pointer;
  font:800 11px/1 var(--body);color:#151515;transition:background-color .08s,box-shadow .12s,transform .08s;-webkit-user-select:none;user-select:none}
.pad.in{background:#d9d9d9;box-shadow:0 0 10px rgba(255,255,255,.12)}
.pad.root{background:var(--rust);box-shadow:0 0 14px color-mix(in srgb,var(--rust) 50%,transparent)}
.pad.out{background:#2b2b2b;color:#777}
.pad.hit,.pad.lit{background:var(--play)!important;box-shadow:0 0 18px color-mix(in srgb,var(--play) 70%,transparent);color:#111;transform:scale(.96)}
.pad.drum{background:color-mix(in srgb,var(--teal) 35%,#222);color:#e8e8e8;font-size:9.5px;text-align:center;padding:2px;line-height:1.05}
.pad.drum.has{background:color-mix(in srgb,var(--teal) 70%,#222);color:#111}
.pad.drum.sel{background:#f0f0f0;color:#111}
.pad.step{background:#2c2c2c}
.pad.step.beat{background:#3a3a3a}
.pad.step.on{background:var(--teal);box-shadow:0 0 12px color-mix(in srgb,var(--teal) 55%,transparent)}
.pad.step.now{background:var(--play)!important}
.pad.looplen{background:#2a2a2a}
.pad.looplen.on{background:#bdbdbd}
.pads-body{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)!important;align-items:start}
.pad-side{gap:14px}
/* a readout styled like Push's display: black glass, white and orange type */
.screen-ro{background:#0c0c0c;color:#eaeaea;border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px #2c2c2c}
.screen-ro b{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.1;color:#fff}
.screen-ro span{font-size:13px;color:#ff9b3d;font-weight:700}
.screen-ro.big b{font-size:32px}
.screen-ro.big span{order:-1;letter-spacing:.14em;text-transform:uppercase;font-size:11px}

/* the control diagram */
.pushwrap{background:var(--panel);border-radius:12px;padding:8px}
svg.push{width:100%;height:auto;display:block}
svg.push .body{fill:#161616;stroke:#333;stroke-width:2}
[data-theme="light"] svg.push .body{fill:#242424}
svg.push text{font:700 11px var(--body);fill:#bdbdbd;pointer-events:none}
svg.push .ctl{cursor:pointer}
svg.push .ctl rect,svg.push .ctl path,svg.push .ctl circle{fill:#2e2e2e;stroke:#444;stroke-width:1.2;transition:fill .15s}
svg.push .ctl line{stroke:#aaa;stroke-width:2.5;stroke-linecap:round}
svg.push .ctl rect.pp{fill:#262626;stroke:#333}
svg.push .ctl rect.screen{fill:#050505;stroke:#3a3a3a}
svg.push .scrtext{fill:#666;font-size:15px}
svg.push .ctl:hover rect,svg.push .ctl:hover circle,svg.push .ctl:hover path{stroke:var(--rust)}
svg.push .ctl.lit rect,svg.push .ctl.lit circle,svg.push .ctl.lit path{fill:var(--rust);stroke:#ffd0a6}
svg.push .ctl.lit rect.pp{fill:color-mix(in srgb,var(--rust) 75%,#222)}
svg.push .ctl.lit rect.screen{fill:#1a0f05}
svg.push .ctl.lit text{fill:#111}
svg.push .ctl.lit .scrtext{fill:var(--rust)}
svg.push .ctl.sel rect,svg.push .ctl.sel circle,svg.push .ctl.sel path{stroke:#fff;stroke-width:2.5}
svg.push .lbl{fill:#999}
.ctl-body{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)!important;align-items:start}
.ctl-fn{font-size:17px;line-height:1.5;margin:0}
.combos{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}

/* workflows */
.wf-body{grid-template-columns:minmax(200px,.62fr) minmax(0,1fr) minmax(0,1.15fr)!important;align-items:start}
.wf-push{position:sticky;top:70px}
.ex-list{display:flex;flex-direction:column}
.ex-list button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--rule);border-radius:6px}
.ex-list button b{font-family:var(--display);font-weight:600;font-size:17px;color:var(--teal)}
.ex-list button span{font-weight:700;font-size:14px}
.ex-list button i{font-style:normal;font-size:11px;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.ex-list button[aria-selected="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--teal)}
.wf-head{display:flex;flex-direction:column;gap:2px}
.wf-head h2{margin:0 0 4px;font-family:var(--display);font-weight:500;font-size:24px}
.wf-steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px}
.wf-steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:9px 10px;border-radius:8px;cursor:pointer;background:transparent}
.wf-steps li::before{content:counter(s);grid-row:span 2;font-family:var(--display);font-weight:600;font-size:18px;color:var(--mute);text-align:right}
.wf-steps li p{margin:0;font-size:14.5px;line-height:1.45}
.wf-steps li[aria-current="step"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--rust)}
.wf-steps li[aria-current="step"]::before{color:var(--rust)}
.chips-ro{display:flex;flex-wrap:wrap;gap:5px}
.chips-ro span{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:4px;background:color-mix(in srgb,var(--rust) 20%,transparent);color:var(--ink)}

/* the course map as a Session View */
.sv-top{display:flex;align-items:center;gap:14px;max-width:900px;margin:0 auto;width:100%}
.sv-meter{flex:1;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.sv-meter i{display:block;height:100%;background:var(--play)}
.sv{display:flex;flex-direction:column;gap:12px;max-width:1120px;margin:0 auto;width:100%;background:var(--panel);border-radius:10px;padding:10px}
.sv-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px}
.sv-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.sv-head{background:var(--c);color:#111;border-radius:4px;padding:6px 8px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.sv-head b{font-size:12px;font-weight:800;line-height:1.15;min-width:0}
.sv-head span{font-size:11px;font-weight:800;opacity:.75}
.sv-slot{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:7px;min-height:44px;padding:5px 8px;border-radius:4px;background:var(--panel2);font-size:12.5px;font-weight:700;line-height:1.15}
.sv-slot .sv-ic{flex:none;width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.sv-slot.done{background:var(--c);color:#111}
.sv-slot.open{background:color-mix(in srgb,var(--play) 22%,var(--panel2));color:var(--ink);box-shadow:inset 0 0 0 2px var(--play);animation:queued 1s steps(2,end) infinite}
.sv-slot.open .sv-ic{color:var(--play)}
.sv-slot.lock,.sv-slot.empty{color:var(--mute);cursor:default}
.sv-slot.lock .sv-ic,.sv-slot.empty .sv-ic{border:0;width:7px;height:7px;background:currentColor;opacity:.6}
.sv-slot.empty{background:color-mix(in srgb,var(--panel2) 50%,transparent)}
.sv-slot:not(.lock):not(.empty):focus-visible{outline:3px solid var(--gold);outline-offset:1px}
@keyframes queued{50%{box-shadow:inset 0 0 0 2px var(--play),0 0 0 3px color-mix(in srgb,var(--play) 30%,transparent)}}
.sv-scene{display:grid;grid-template-columns:auto minmax(0,320px);gap:12px;align-items:center;justify-content:end}
@media (prefers-reduced-motion:reduce){.sv-slot.open{animation:none}}

/* the quiz as a clip being recorded */
.quiz{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-name{display:flex;align-items:center;gap:8px;font-weight:800;align-self:center}
.quiz-name i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.qsteps{display:flex;gap:4px}
.qsteps i{flex:1;height:14px;border-radius:3px;background:var(--panel2)}
.qsteps i.bonus{background:color-mix(in srgb,var(--plum) 35%,var(--panel2))}
.qsteps i.now{background:#e9e9e9}
.qsteps i.ok{background:var(--play)}
.qsteps i.no{background:var(--rec)}
.qcount{text-align:center;font-weight:800;min-height:1.3em}
.qtext{font-size:21px;font-weight:800;min-height:1.4em;text-align:center;font-family:var(--body)}
.qfig{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.qopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.qopt{font-size:15.5px;min-height:52px;padding:8px 18px;white-space:normal;max-width:340px;text-align:left}
.qfb{min-height:40px;text-align:center}

@media (max-width:980px){
  .pads-body,.ctl-body,.wf-body{grid-template-columns:minmax(0,1fr)!important}
  .padgrid{max-width:100%}
  .sv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sv-scene{grid-template-columns:minmax(0,1fr)}
  .home-sub{align-items:flex-start;text-align:left}
}
@media (max-width:560px){ .pad{font-size:8.5px;border-radius:5px} .padgrid{gap:4px} .padwrap{padding:7px} .sv-grid{grid-template-columns:minmax(0,1fr)} }

/* ===== the game layer, in Live's colours: headroom lights, the take meter, the game bar, seals, the found bar ===== */
.take{background:var(--panel);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.take-row{display:flex;align-items:center;gap:10px}
.take-row .sp{flex:1}
.take-meter{height:10px;border-radius:3px;background:var(--panel2);overflow:hidden}
.take-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--play),color-mix(in srgb,var(--play) 70%,var(--gold)));transition:width var(--sp-morph-ms,.4s) var(--sp-morph,ease-out)}
.take.clipped{animation:clip .5s ease-out}
@keyframes clip{0%{box-shadow:inset 0 0 0 3px var(--rec)}100%{box-shadow:inset 0 0 0 0 transparent}}
.take.kept .take-meter i{background:var(--play)}
.gb-hearts{display:flex;gap:5px}
.gb-hearts i{width:14px;height:14px;border-radius:50%;background:var(--panel2);box-shadow:inset 0 0 0 1.5px var(--rule)}
.gb-hearts i.on{background:var(--rec);box-shadow:0 0 8px color-mix(in srgb,var(--rec) 60%,transparent)}
.pbar.gamebar{gap:10px}
.gb-stat{display:flex;flex-direction:column;align-items:center;line-height:1.05;position:relative;min-width:52px}
.gb-stat b{font-size:17px;font-weight:900;color:var(--rust);font-variant-numeric:tabular-nums}
.gb-stat small{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gb-stat .pts-gain{position:absolute;top:-16px;right:-6px;font-size:13px;font-weight:900;color:var(--ok);animation:gain 1.2s ease-out forwards}
.gb-stat .pts-gain.neg{color:var(--bad)}
@keyframes gain{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-10px)}}
.gb-prog{display:flex;flex-direction:column;gap:4px;min-width:150px;max-width:320px}
.gb-prog-t{display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-prog-t b{font-size:15px;font-weight:800}
.gb-prog-t small{font-size:12px;color:var(--mute);font-weight:700}
.gb-meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.gb-meter i{display:block;height:100%;background:var(--play)}
.gb-btn{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--rule);background:transparent;border-radius:6px;padding:4px 10px;font-size:17px;font-weight:900;line-height:1.1;min-height:44px;justify-content:center;color:var(--ink)}
.gb-btn small{font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.gb-btn:disabled{opacity:.35;cursor:default}
.gb-back{font-size:14px;flex-direction:row}
@media (max-width:820px){ .gb-btn small,.gb-stat small,.gb-prog-t small{display:none} .gb-prog{min-width:90px} .pbar.gamebar{gap:6px} }
.sv-test{all:unset;cursor:pointer;box-sizing:border-box;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px;border-radius:4px;border:1px dashed var(--rule);color:var(--mute)}
.sv-test:hover{color:var(--ink);border-color:var(--c,var(--ink))}
.sv-test.done{cursor:default;border-style:solid;color:var(--ok)}
.seal{max-width:560px;margin:28px auto;text-align:center;background:var(--panel);border-radius:12px;padding:26px 24px 18px}
.seal-lock{display:grid;grid-template-columns:repeat(2,18px);gap:5px;justify-content:center;margin-bottom:12px}
.seal-lock i{width:18px;height:18px;border-radius:4px;background:var(--pad);box-shadow:inset 0 0 0 1.5px var(--rule)}
.seal-lock i:first-child{background:var(--play);animation:queued 1s steps(2,end) infinite}
.seal h2{font-family:var(--display);font-weight:500;font-size:24px;margin:4px 0 8px}
.seal p{margin:0 0 16px;line-height:1.5}
.seal-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.seal-open{margin-top:16px;border:0;background:none;color:var(--mute);font-weight:700;text-decoration:underline;cursor:pointer}
.peek-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 18%,transparent);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}
.wf-body.sealed{grid-template-columns:minmax(200px,.62fr) minmax(0,2.15fr)!important}
.found-bar{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;background:var(--panel);border-radius:8px;padding:10px 14px}
.found-bar b{font-size:17px;color:var(--rust)}
.found-bar span{color:var(--mute);font-size:13px;font-weight:600}
.found-meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.found-meter i{display:block;height:100%;background:var(--rust)}
.gloss-row.unfound{opacity:.55;border-style:dashed}
.gloss-row.unfound b{color:var(--mute)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px}
.modes button{all:unset;cursor:pointer;box-sizing:border-box;border-radius:8px;padding:10px 14px;background:var(--panel);display:flex;flex-direction:column;gap:2px;border:1.5px solid transparent}
.modes button b{font-weight:800}
.modes button span{font-size:12.5px;color:var(--mute);font-weight:600}
.modes button[aria-pressed="true"]{border-color:var(--rust)}
.home-body.book{grid-template-columns:minmax(0,1fr)}
.home-body.book .home-tiles{grid-row:auto;grid-template-columns:repeat(4,minmax(0,1fr))}
.ref-card{max-width:760px;max-height:80vh;overflow:auto}
.ref-body{display:flex;flex-direction:column;gap:10px}
.ref-body svg{max-width:100%}
table.ref{border-collapse:collapse;width:100%;font-size:13px}
table.ref th,table.ref td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.ref th{white-space:nowrap;color:var(--ink)}

/* ===== the scenes: a Session View strip of the module's loop above the take; the fifth track is the foe ===== */
.scene-strip{background:var(--panel);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--m)}
.sc-head{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sc-head .sp{flex:1}
.sc-head .muted{font-size:12px;font-weight:700}
.sc-track{display:grid;grid-template-columns:52px minmax(0,1fr) 90px;gap:8px;align-items:center;min-height:26px}
.sc-name{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sc-clip{display:flex;align-items:center;gap:7px;background:var(--c);color:#111;border-radius:4px;padding:3px 8px;font-size:12.5px;font-weight:800;min-height:24px;transition:filter .15s,opacity .3s}
.sc-clip i{flex:none;width:0;height:0;border-left:8px solid #111;border-top:5px solid transparent;border-bottom:5px solid transparent}
.sc-track.pulse .sc-clip{filter:brightness(1.25)}
.sc-lvl{height:8px;border-radius:3px;background:var(--panel2);overflow:hidden}
.sc-lvl i{display:block;height:100%;width:55%;background:var(--play);transition:width .12s}
.sc-track.pulse .sc-lvl i{width:92%}
.sc-track.foe .sc-clip{background:color-mix(in srgb,var(--rec) 80%,#222);color:#fff}
.sc-track.foe .sc-clip i{border-left-color:#fff}
.sc-foe-meter{height:10px;border-radius:3px;background:var(--panel2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.sc-foe-meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--rec),color-mix(in srgb,var(--rec) 60%,var(--gold)));transition:width var(--sp-morph-ms,.4s) var(--sp-morph,ease-out)}
.sc-track.foe.struck .sc-clip{animation:struck .45s ease-out}
@keyframes struck{0%{filter:brightness(2);transform:translateX(3px)}100%{filter:none;transform:none}}
.sc-track.foe.out .sc-clip{background:var(--panel2);color:var(--mute);text-decoration:line-through}
.sc-track.foe.out .sc-clip i{border:0;width:7px;height:7px;background:currentColor;opacity:.6}
.scene-strip.clipped{animation:clip .5s ease-out}
.music-chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--rule);background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);min-height:30px;margin-left:auto}
.music-chip i{width:9px;height:9px;border-radius:50%;background:var(--panel2);box-shadow:inset 0 0 0 1.5px var(--rule)}
.music-chip[aria-pressed="true"]{color:var(--ink);border-color:var(--play)}
.music-chip[aria-pressed="true"] i{background:var(--play);box-shadow:0 0 8px color-mix(in srgb,var(--play) 60%,transparent)}
.toolbar .music-chip{margin-left:0}
@media (max-width:560px){ .sc-track{grid-template-columns:44px minmax(0,1fr) 60px} .sc-head .muted{display:none} }

/* ===== 5 Listen: the grid plus a Push-style readout, the key meter and the suggestion chips ===== */
.pad.sug{background:var(--gold)!important;color:#111;box-shadow:0 0 14px color-mix(in srgb,var(--gold) 60%,transparent)}
.screen-ro b.dim{color:#8a8a8a}
.listen-key{display:flex;flex-direction:column;gap:4px}
.listen-key b{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.1}
.listen-key span{font-size:13px;color:var(--mute);font-weight:700}
.listen-sug,.listen-trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip.sug{display:flex;flex-direction:column;gap:0;line-height:1.05;padding:5px 10px;min-height:44px;justify-content:center}
.chip.sug b{font-size:15px}
.chip.sug span{font-size:10.5px;color:var(--mute);font-weight:800;letter-spacing:.06em}
.chip.sug.next{border-color:var(--gold)}
.chip.sug.far{border-color:var(--rust)}
.listen-trail b{background:var(--panel);border-radius:4px;padding:3px 8px;font-size:13px}
.listen-src{font-size:12.5px;font-weight:700}

/* the Learn / Book switch sits in the cover header, compact */
.home-sub .modes{grid-template-columns:auto auto;gap:6px;margin:4px 0 2px}
.home-sub .modes button{padding:6px 12px;text-align:left}
.home-sub .modes button span{display:none}
.home-body.book{grid-template-rows:minmax(0,1fr)}
.home-body.book .home-tiles{grid-row:1;grid-template-rows:minmax(0,1fr)}
@media (max-width:820px){ .home-body.book .home-tiles{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none} }

[]},{"id":"stopclip","name":"Stop Clip","group":"track","fn":"Stops the selected clip. Hold it and press a lower display button to stop that track’s clip.","combos":["Shift + Stop Clip: stop all clips"]},{"id":"mute","name":"Mute","group":"track","fn":"Mutes the selected track. Hold it and press a lower display button, a drum pad, a step or a device to mute that instead.","combos":[]},{"id":"solo","name":"Solo","group":"track","fn":"Solos the selected track. Hold it and press a lower display button or a drum pad to solo that instead.","combos":[]},{"id":"quantize","name":"Quantize","group":"edit","fn":"Snaps the selected notes (or all notes) to the grid; on audio clips it moves transients. Hold for the settings.","combos":["Quantize + drum pad: quantize only that pad"]},{"id":"fixedlength","name":"Fixed Length","group":"record","fn":"When on, new clips record for a set number of bars; when off, recording runs until you press New, Record or Play. Hold to set the length or turn on Phrase Sync.","combos":[]},{"id":"automate","name":"Automate","group":"record","fn":"Turns automation recording on (red) or off (white).","combos":["Shift + Automate: re-enable overridden automation","Delete + Automate: delete all automation in the clip"]},{"id":"new","name":"New","group":"record","fn":"Stops the selected clip and gets an empty clip slot ready on the track, so the next take starts fresh.","combos":[]},{"id":"capture","name":"Capture","group":"record","fn":"Turns what you just played on an armed track into a clip — no need to have pressed Record first.","combos":[]},{"id":"record","name":"Record","group":"record","fn":"Starts recording; press again to stop recording and keep playing; a third press turns on overdub.","combos":["Record + lower display button: arm that track","Shift + Record: switch Session and Arrangement recording (Control Mode)"]},{"id":"play","name":"Play","group":"record","fn":"Starts and stops playback.","combos":[]},{"id":"note","name":"Note","group":"mode","fn":"Note Mode: the pads play notes or drums, in the layout chosen with Layout.","combos":[]},{"id":"sessionpad","name":"Session","group":"mode","fn":"Session Pad Mode: every column of pads is a track, every pad a clip. (The button under the D-pad.)","combos":[]},{"id":"scale","name":"Scale","group":"notes","fn":"In Note Mode, picks the key and the scale, plus In Key / Chromatic, Fixed and the 4ths / 3rds / Sequential layout. Saved with the Set.","combos":[]},{"id":"layout","name":"Layout","group":"notes","fn":"Cycles the pad layouts. Melodic tracks: 64 Notes, Melodic Sequencer, Melodic Sequencer + 32 Notes. Drum Racks: Loop Selector, 16 Velocities, 64 Pads.","combos":[]},{"id":"repeat","name":"Repeat","group":"notes","fn":"Hold a pad for a stream of even notes at the rate set by the Repeat Intervals buttons. Tap to latch, hold for a moment.","combos":[]},{"id":"accent","name":"Accent","group":"notes","fn":"Every note you play or step in comes in at full velocity (127). Tap to latch, hold for a moment.","combos":[]},{"id":"doubleloop","name":"Double Loop","group":"edit","fn":"Doubles the loop’s length along with the material in it — a fast way to make a variation of the second half.","combos":[]},{"id":"duplicate","name":"Duplicate","group":"edit","fn":"Scene Workflow: a new scene from the clips playing now. Clip Workflow: copies the clip to the next slot.","combos":["Duplicate + drum pad: copy the pad","Duplicate + track display button: duplicate the track","Session: hold Duplicate, tap a clip, tap a slot to paste"]},{"id":"convert","name":"Convert","group":"edit","fn":"Changes what a sound lives in: Simpler to a Drum Rack, slices to pads, a pad to its own Simpler, or audio to MIDI (harmony, melody or drums).","combos":[]},{"id":"delete","name":"Delete","group":"edit","fn":"Hold it and press what you want gone: a clip, a drum pad’s notes, a device, a track, a slice.","combos":["Delete + encoder: delete that parameter’s automation, or reset it to its default"]},
